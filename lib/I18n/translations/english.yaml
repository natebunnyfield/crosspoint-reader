STR_BOOK_NOTES: "Book Notes"
STR_BOOK_NOTES_INTRO: "This reader adapts every book to a small screen. For this book that meant the changes below. None of them is a fault in your device."
STR_BOOK_NOTE_DRM_H: "This book is locked"
STR_BOOK_NOTE_DRM_B: "The file carries a copy-protection record. This reader cannot unlock a protected book and does not try: it opens the file as though the contents were plain. Chapters that really are encrypted will fail to open or arrive as nonsense. No setting will change that; the book has to be supplied unprotected."
STR_BOOK_NOTE_FONTS_H: "The book's own typefaces are not being used"
STR_BOOK_NOTE_FONTS_B: "This book carries font files and asks for them by name. This reader cannot load a typeface out of a book, so every word is set in the reading font you chose in Settings. The text is unaffected; only the shapes of the letters differ. Where a publisher used a font to carry meaning, such as phonetic symbols or musical marks, those characters may be missing rather than merely different."
STR_BOOK_NOTE_ENCODING_H: "Part of this book is stored in a character encoding this reader cannot read"
STR_BOOK_NOTE_ENCODING_B: "At least one file in this book says its text is written in %s, and no table for that encoding is built into this reader. UTF-8, UTF-16, plain ASCII and about thirty single-byte code pages are understood, including the Windows and ISO ones a European publisher is likely to have used; the multi-byte encodings once used for Japanese, Chinese and Korean are not. A chapter written in an encoding that is not understood cannot be opened at all, and page turning stops when it reaches one. Converting the book to UTF-8 on a computer fixes it; no setting here can."
STR_BOOK_NOTE_MISSING_GLYPHS_H: "Some characters have no shape in this font"
STR_BOOK_NOTE_MISSING_GLYPHS_B: "At least %u different characters in the part of this book read so far have no shape in the reading font you have chosen. Each one is drawn as a replacement mark instead of as itself: either the marker the font supplies for the purpose, or a hollow box where it supplies none. The usual causes are alphabets a Latin typeface does not carry, such as Greek, Cyrillic, Japanese or Korean, and symbols and emoji. Nothing has been dropped and the words around them are unaffected; the mark stands exactly where the character stands. A reading font on the memory card that covers the script will draw them properly. Changing the reading size will not."
STR_BOOK_NOTE_NO_TOC_H: "This book has no contents list"
STR_BOOK_NOTE_NO_TOC_B: "Neither of the two places an EPUB can keep a table of contents could be read, so the chapter list on this screen is empty. The book is otherwise intact and you can read it end to end. You simply cannot jump to a named chapter; page turning and the progress bar work as usual."
STR_BOOK_NOTE_TOC_UNRESOLVED_H: "Some contents entries lead nowhere"
STR_BOOK_NOTE_TOC_UNRESOLVED_B: "At least one entry in this book's table of contents points at a file that is not in the book's reading order. Those entries are left out of the chapter list rather than offered as chapters that cannot be opened. This is a fault in how the book was made, not something you can correct here."
STR_BOOK_NOTE_SPINE_MISSING_H: "Part of the reading order is missing"
STR_BOOK_NOTE_SPINE_MISSING_B: "The book's reading order names at least one file that the book's own inventory of its parts does not list. It cannot be found, so it has been left out. If a chapter seems to be absent, or the text jumps from one place to another, this is why."
STR_BOOK_NOTE_NO_HYPHENATION_H: "Words are not being hyphenated"
STR_BOOK_NOTE_NO_HYPHENATION_B: "Hyphenation patterns are built into this reader for English and Spanish only. This book is in another language, or does not say what language it is in, so no word is ever broken across the end of a line. On a narrow page that leaves wider gaps between words than the text would otherwise have, and it is often the reason a paragraph looks looser here than it does in print."
STR_BOOK_NOTE_CSS_PARTIAL_H: "Part of the book's styling could not be read"
STR_BOOK_NOTE_CSS_PARTIAL_B: "This book's stylesheet uses kinds of rules this reader does not implement: rules that depend on where an element sits inside another, on identifiers, or on the size of the screen. %u of them were passed over. Whatever those rules were meant to change, such as an indent, a spacing or emphasis on a particular passage, falls back to this reader's own typography. The text itself is complete."
STR_BOOK_NOTE_CSS_UNITS_H: "Some of the book's measurements are in units this reader cannot convert"
STR_BOOK_NOTE_CSS_UNITS_B: "This book sets at least one margin, indent or size in %s, and this reader has no honest way to turn that into a distance on this screen. Rather than guess, it leaves those rules out and uses its own spacing instead. Physical units are converted properly: centimeters, millimeters, inches, points and picas all become real distances here, sized so that a measurement in points matches the type beside it. What cannot be converted are units that depend on the shape of a particular letter, such as ex and ch, and units measured against the size of a browser window. A paragraph that seems to sit closer to the edge than the publisher intended is where this shows."
STR_BOOK_NOTE_CSS_SKIPPED_H: "Some of the book's styling was skipped entirely"
STR_BOOK_NOTE_CSS_SKIPPED_B: "A whole stylesheet was too large to read, or this book defines more style rules than this reader keeps, or memory ran short while reading them. Everything past that point was never applied. On a heavily designed book this can mean whole sections are set in the reader's default style rather than the publisher's."
STR_BOOK_NOTE_VERTICAL_H: "This book asks to be set vertically"
STR_BOOK_NOTE_VERTICAL_B: "The book's stylesheet asks for vertical writing, running top to bottom in columns from the right, as Japanese and Chinese books traditionally are. This reader can only set text horizontally, so the book is laid out in horizontal lines from the left. Every word is present and in order, but the arrangement on the page is not the one the publisher intended."
STR_BOOK_NOTE_ALIGNMENT_H: "The book's paragraph alignment is being overridden"
STR_BOOK_NOTE_ALIGNMENT_B: "This book's stylesheet asks for particular paragraphs to be set flush left, centered or flush right. This reader sets that aside and justifies every paragraph, both edges straight, because it decides alignment for itself from the width of the page. Headings still follow the book. Nothing is lost; the paragraphs simply sit differently on the page from the way the publisher set them."
STR_BOOK_NOTE_RAGGED_H: "Justified text is being set ragged instead"
STR_BOOK_NOTE_RAGGED_B: "The narrowest paragraph on this page holds about %u characters per line, and justified text is set no narrower than %u. Below that, justifying a line means either gaping holes between the words or a hyphen at the end of nearly every line, so paragraphs that narrow are given a ragged right edge instead. A smaller reading size, narrower margins, or turning the device to landscape brings the line back above %u characters, and the justified setting comes back with it. Justified Text in Settings moves where that limit falls."
STR_BOOK_NOTE_IMAGES_H: "Some images could not be shown"
STR_BOOK_NOTE_IMAGES_B: "%u of this book's images could not be drawn, and they carried no descriptive text to put in their place, so nothing at all appears where they were. The usual causes are drawing formats this reader does not read, such as SVG, GIF and WebP, or a damaged image file. Where a book supplied descriptive text, that is shown instead and is not counted here."
STR_BOOK_NOTE_TABLES_H: "Tables are not shown as tables"
STR_BOOK_NOTE_TABLES_B: "This book contains at least one table. A table needs more width than this screen has, so each cell is set as its own short paragraph in reading order with its column heading in front of it, or, for a wide table, the page is turned on its side. A table inside another table cannot be handled at all and its contents are left out."
STR_BOOK_NOTE_PRE_H: "Preformatted text has lost its layout"
STR_BOOK_NOTE_PRE_B: "This book contains preformatted text: a code listing, a diagram made of characters, or verse laid out by hand, where the spaces and the line breaks are part of the content. This reader treats all text as flowing prose, so runs of spaces collapse to one and the lines are broken again to fit the page. Every word is there, but the shape it was arranged in is not."
