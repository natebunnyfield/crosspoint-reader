# Text-grotesque candidates for CrossPoint (evaluation set)
#
# NOT a shipping list, and a sibling of sans-candidates.yaml rather than an
# addition to sd-fonts.yaml — that file feeds the device's font-download
# manifest, which is no place for unranked candidates. installed_families:
# still rules what ships.
#
#   python3 lib/EpdFont/scripts/build-sd-fonts.py \
#     --config lib/EpdFont/scripts/grotesque-candidates.yaml --output-dir out/
#
# Same uniform-slot rule as the other two files: x-height 12/14/16/18 px
# measured on the hinted render, leading solved against 34/39/45/51 — which is
# what Edgar and TeX Gyre Schola actually BUILD to, not the 34/40/46/51 the
# sd-fonts.yaml header states. `metrics:` is per-1000-upem; the builder scales
# by head.unitsPerEm/1000 before writing hhea, so the same number means the
# same leading on a 2048-upem face. Deviations are noted per family.
#
# intervals: latin-ext deliberately, matching sans-candidates.yaml, so set
# widths are directly comparable against that bench's numbers.

families:

  - name: Archivo
    description: "Omnibus-Type grotesque drawn for text (Latin)"
    intervals: latin-ext
    # Deviations (hinting skips the pixel value; no span fixes it):
    #   slot 0: xh 11, advY 33
    #   slot 2: advY 46
    #   slot 3: advY 52
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1202, descent: -359, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf", variable: {wdth: 100, wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf", variable: {wdth: 100, wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo-Italic%5Bwdth%2Cwght%5D.ttf", variable: {wdth: 100, wght: 400}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo-Italic%5Bwdth%2Cwght%5D.ttf", variable: {wdth: 100, wght: 700}}

