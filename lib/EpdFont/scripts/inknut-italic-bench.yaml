  # ── ROUND 15, 2026-08-13: the roman moves up a weight, and the italic is
  #    re-matched to it and bracketed ────────────────────────────────────────
  #
  # Ask: "inknut thin is too thin ... leave bold and bold italic as is, but up
  # inknut one level higher to regular, then determine the best match for
  # junicode expanded italic, then bracket it out precisely two stops either
  # way." Bold (Inknut Bold) and bolditalic (wght 700 + embolden 0.042) are
  # therefore IDENTICAL in all eight families below -- only the roman and the
  # italic move.
  #
  # ── WHAT IS SAFE TO CARRY OVER ──────────────────────────────────────────
  # Inknut's x-height does not move with weight: Light and Regular both measure
  # 0.5320 em, cap 0.7870 vs 0.7860. So `scale: 1.25` and `ENLA: 14`, which
  # were derived against Light's x-height and cap, hold unchanged for Regular.
  # Its space advance barely moves either -- 0.2840 -> 0.2790 em -- and renders
  # to the SAME 6/7/8/9 px word gap at the four sizes, so `word_space_em: -0.09`
  # from round 13 needs no re-derivation.
  #
  # ── LIGHT -> REGULAR IS SUB-PIXEL, AND THAT IS THE ROUND'S RISK ──────────
  # Measured on the .cpfont rasterisation (FreeType 150 dpi, converter
  # quantisation, BW ink = level >= 1), stem px of l/n at the four sizes:
  #
  #   Inknut Light     3/3  3/4  4/4  4/4     ink/advance  95.4% of Regular
  #   Inknut Regular   3/3  3/4  4/4  4/4     ink/advance 100.0%
  #   Inknut Medium    4/3  4/4  5/4  5/5     ink/advance 108.0%
  #
  # Light and Regular render the SAME stem at every reading size -- the step is
  # 0.0078 em, which is 0.16-0.26 px across this ppem range and rounds away,
  # exactly like the wght 600->700 italic step round 14 measured. Regular is
  # ~5% more ink (edge pixels, curves), not a heavier stem. MEDIUM is the first
  # Inknut weight that moves a stem pixel. The three IJ15R families below exist
  # to put that question in front of the eye rather than assert it.
  #
  # ── THE MATCH: wght 590, on colour not on stems ─────────────────────────
  # Two metrics disagree and the choice between them matters:
  #
  #   stem parity   Inknut Regular's stem is 0.1172 em; the italic reaches it
  #                 at wght ~667 (650 = 0.1133, 700 = 0.1250, all post-x1.25).
  #   colour parity ink per unit advance -- the page colour an italic phrase
  #                 contributes inside a roman sentence -- reaches 100.0% at
  #                 wght ~590.
  #
  # Colour wins, for the reason measure_enla.py already argues: the page is
  # rendered BW with no antialiasing, so what the eye gets is ink coverage, and
  # stem parity in design units is not preserved by the rasteriser. Junicode
  # Expanded is inherently darker per advance than Inknut at equal stem.
  #
  # Note where that lands: the SHIPPED italic is wght 600. Against Inknut Light
  # it ran ~7% dark; moving the roman up to Regular lands the existing pairing
  # within 1% of colour parity on its own. The match is essentially where the
  # family already sits, which is a finding, not a non-result.
  #
  # ── THE STOP IS A PIXEL STOP, NOT AN AXIS STOP ──────────────────────────
  # A wght-unit stop is invisible here. The entire 400-700 axis is 0.047 em of
  # stem = about ONE pixel at 10 pt; 25 or 50 units is 0.1-0.3 px. So the five
  # candidates are spaced by ~3.8% of ink/advance each, which is the smallest
  # step that changes at least one whole stem pixel. Measured ladder, stem px
  # l/n at 10/12/14/16 and mean ink/advance against Inknut Regular:
  #
  #   ROMAN Regular    3/3  3/4  4/4  4/4    100.0%
  #   -2  wght 500     2/4  3/4  3/5  4/6     93.2%
  #   -1  wght 545     2/4  3/5  3/5  4/6     96.9%
  #   ->  wght 590     2/4  3/5  3/6  4/6    100.7%   the match
  #   +1  wght 645     3/5  3/5  4/6  4/6    105.2%
  #   +2  wght 700     3/5  4/5  4/6  5/7    109.5%
  #
  # Every adjacent pair differs in exactly one of the eight stem readings, so
  # each stop is a real rendered difference rather than an axis number.
  #
  # +2 lands exactly on the axis ceiling, which is lucky: no synthetic embolden
  # is needed anywhere in this bracket. Had the match sat at the stem-parity
  # 667 instead, +1 and +2 would both have had to be synthetic -- and an
  # embolden at the default y_ratio 0.5 grows the x-height by 2 px (11/14/16/19
  # -> 13/16/18/21), so it would have changed the italic's SIZE as well as its
  # weight. `y_ratio: 0.0` was measured as the pure-weight variant if a future
  # round ever needs to go past 700.
  #
  # Not touched, but measured and worth its own round: the italic's x-height
  # runs 11/14/16/19 px against the roman's 13/15/17/19 -- 2 px short at 10 pt,
  # 1 px at 12 pt, level by 16 pt. That is ENLA 14's doing and it is the
  # shipped state, not something this round changed.

