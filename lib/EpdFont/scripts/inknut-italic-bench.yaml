  # ── ROUND 13, 2026-08-13: owner rulings, and a rig bug that invalidated a
  #    whole round of word-space proofs ──────────────────────────────────────
  #
  # WINNERS from the round-12 decks: ENLA 14, scale x1.25, tracking 0.
  #
  # WORD SPACE IS REOPENED, because "word space has no effect" was correct
  # about the images and wrong about the font, and the fault was mine.
  # Diffing the frames on request: 0 differing pixels across the entire
  # word-space ladder, while the .cpfont files and the whole-page BMPs all
  # differed. The only differing pixels on the page were rows 21-41 -- the
  # family-name header.
  #
  # Cause, render_harness.cpp:400. The inline specimen computed ONE word gap:
  #     getTextWidth(id, "n n", EpdFontFamily::REGULAR) - 2 * getTextWidth(...)
  # and reused it for every gap regardless of the run's style, so the italic's
  # own space advance was never consulted. The real reader does not do this --
  # ParsedText.cpp:755 asks getSpaceAdvance() with `wordStyles[j - 1]`, the
  # style of the word to the LEFT of the gap. The harness now matches.
  #
  # The knob itself was fine and had been unit-checked at the converter (ppem
  # 25: word_space -0.06 em moved the space advance -1.50 px and nothing else).
  # A green unit test on the font plus a rendered page that never exercises the
  # value is exactly the shape of a false pass.
  #
  # WHAT THE CORRECTED NUMBERS SAY. The gap snaps to a whole pixel, so the
  # ladder's real resolution is coarser than its steps -- -0.06 and -0.09 both
  # render 7 px at 12 pt, -0.18 and -0.21 both render 4 px. Rendered gap, px:
  #
  #     word_space_em   10pt  12pt  14pt  16pt
  #     roman            6     7     8     9
  #     0 (as drawn)     7     9    10    12
  #     -0.06            6     7     9    10
  #     -0.09            6     7     8     9   <- roman parity at EVERY size
  #     -0.12            5     6     7     8
  #
  # -0.09 em is the value that matches the roman's word gap at all four sizes.
  # -0.06 matches at 10 and 12 pt and runs a pixel wide at 14 and 16, which is
  # why it looked right on a 12 pt proof.

  # ── ROUND 14, 2026-08-13: a bold italic that steps like the roman pair ────
  #
  # Ask: the italic->bolditalic step should match the ink and stroke-width step
  # from Inknut Light to Inknut Bold. Measured at 200 ppem, em-relative:
  #
  #   Inknut Light  stem 0.1100 em   ink 0.1332 em^2
  #   Inknut Bold   stem 0.1700 em   ink 0.2044 em^2
  #                 -> stem x1.545, ink x1.535   (the step to match)
  #
  #   Junicode italic, wdth 125 / ENLA 14:
  #     wght 300  stem 0.0500    wght 600  stem 0.0850  <- the shipped italic
  #     wght 400  stem 0.0600    wght 700  stem 0.1000  <- the axis ceiling
  #     wght 500  stem 0.0750
  #
  # THE WEIGHT AXIS CANNOT REACH IT. Matching x1.545 from wght 600 needs a stem
  # of 0.1314 em; wght 700, the heaviest italic Junicode draws at any width,
  # gives 0.1000 -- a step of x1.176 where the roman steps x1.545. Junicode's
  # entire italic range is lighter than Inknut's, and the shipped italic
  # already sits near the top of it.
  #
  # So the candidates below are the honest ceiling and three synthetic tops:
  # wght 700 plus an embolden of the remaining 0.031 em and either side of it.
  # An embolden is a stem-fattening applied to outlines not drawn for it, which
  # is adjacent to the 2026-08-13 ruling against distorting letterforms -- hence
  # a bench and not a recipe change. Note the embolden is NOT proportional by
  # default: y_ratio 0.5 grows the horizontal stem twice as fast as the
  # vertical, which is what keeps a faux bold from eating its own x-height.

  - name: InknutJuniBI700
