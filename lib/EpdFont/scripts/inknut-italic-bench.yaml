  # ── ROUND 12, 2026-08-13: fine sweeps, one variable per section ───────────
  #
  # Owner rulings after the round-11 deck:
  #   - force_autohint DROPPED outright. Not a candidate, not a variable.
  #   - ENLA swept 10-15 at 1, scale 1.20-1.25 at 0.01, tracking from 0 at
  #     0.005, word space pushed further negative than -0.06.
  #   - "this interface sucks because it is shared and prevents A/B
  #     comparison": one independent deck PER VARIABLE, so a section can be
  #     parked on one value while another is flicked.
  #
  # WHY WORD SPACE READ IDENTICAL, which was the real complaint: not the value,
  # the specimen. render_harness's inline page contained exactly ONE multi-word
  # italic phrase, so a delta of 1-2 px per space had almost nothing to act on.
  # kPara5/kPara6 now set the SAME sentence roman then italic on consecutive
  # lines, so every gap on the line is the one under test with its own
  # reference directly above it.
  #
  # Tracking is swept 0 -> 0.05 em at 0.005 (the design range: 0.005 em is
  # 0.125 px per glyph at 12 pt, which the 12.4 fixed-point advance carries and
  # accumulates across a line) and then 0.1 / 0.2 / 0.5 em, because the ask
  # read "0-.5" and in the units on screen 0.5 em is 12.5 px of air per letter.
  # The far end is built so the unit can be confirmed by eye rather than argued.
  #
  # Baseline for every section is the round-11 choice: ENLA 12, x1.23,
  # tracking 0, word space -0.06 em, native hinting, 1203/-340, 10/12/14/16 --
  # built as InknutJuniFIN, and reused as the in-range member of all four
  # sections rather than duplicated.

