  - name: OpenSans
    description: "Open Sans — Steve Matteson, humanist workhorse with a large x-height (Latin, Greek, Cyrillic)"
    intervals: latin-ext
    sizes: [10, 13, 14, 16]
    metrics: {ascent: 1010, descent: -499, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OpenSans%5Bwdth%2Cwght%5D.ttf", variable: {wght: 400, wdth: 100}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OpenSans%5Bwdth%2Cwght%5D.ttf", variable: {wght: 700, wdth: 100}}
