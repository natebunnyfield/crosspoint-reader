  # ── Controls ───────────────────────────────────────────────────────────
  # Not proposals. Inter is the UI-neutral reference every reader has seen;
  # Noto Sans is what CrossPoint already ships in flash. Both are here so the
  # candidates are judged against something known rather than in isolation.

  - name: Inter
    description: "CONTROL — Inter, Rasmus Andersson, screen-UI sans (Latin, Greek, Cyrillic)"
    intervals: latin-ext
    sizes: [10, 12, 14, 15]
    metrics: {ascent: 1062, descent: -507, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf", variable: {wght: 400, opsz: 14}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf", variable: {wght: 700, opsz: 14}}
