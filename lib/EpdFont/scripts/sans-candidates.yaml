    intervals: latin-ext
    sizes: [11, 13, 15, 17]
    metrics: {ascent: 945, descent: -496, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/alegreyasans/AlegreyaSans-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/alegreyasans/AlegreyaSans-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/alegreyasans/AlegreyaSans-Italic.ttf"}
