  # The recipe stays so the comparison can be re-run, and the picker label in
  # src/FontDisplayNames.h stays for attribution even though the family never
  # ships. Adding it to installed_families: — or to any surface — is a
  # regression, not a restoration; it needs a fresh ruling.
  - name: Antpolt
    description: "GUST's revival of Adam Półtawski's Polish national serif (Latin)"
    # Same GUST e-foundry team as TeX Gyre Schola above (Jackowski & Nowacki).
