    intervals: reading
    # Uniform slots: xh 12/14/16/18 exact on all four; advY 33/39/46/52,
    # slots 0/2/3 within a pixel. Best-rounded face in the grotesque bench:
    # counters intact, 99% of Latin Extended-A, a real drawn italic.
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1202, descent: -359, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librefranklin/LibreFranklin%5Bwght%5D.ttf", variable: {wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librefranklin/LibreFranklin%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librefranklin/LibreFranklin-Italic%5Bwght%5D.ttf", variable: {wght: 400}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librefranklin/LibreFranklin-Italic%5Bwght%5D.ttf", variable: {wght: 700}}

