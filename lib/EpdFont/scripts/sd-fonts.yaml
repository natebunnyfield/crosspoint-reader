    # Upstream (CTAN) ships Regular/Bold/Italic but no BoldItalic, so
    # bolditalic emboldens the real Italic — never sheared. Measured: italic
    # stems 0.069 em; embolden_em 0.037 + y_ratio 0.35 lands 1.49-1.55x stems
