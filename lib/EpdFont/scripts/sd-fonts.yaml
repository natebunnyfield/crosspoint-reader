    # Uniform slots: xh 12/14/16/18 exact, advY 33/39/45/51 — the cleanest
    # ramp of the three. Its own Latin Extended-A coverage is 88%, so the
    # remaining accents come from the Noto fallback the converter applies.
    sizes: [11, 13, 15, 17]
    metrics: {ascent: 1098, descent: -328, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/hostgrotesk/HostGrotesk%5Bwght%5D.ttf", variable: {wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/hostgrotesk/HostGrotesk%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/hostgrotesk/HostGrotesk-Italic%5Bwght%5D.ttf", variable: {wght: 400}}
