      bold:       {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip", member: "Junicode/TTF/Junicode-SemiCondMedium.ttf"}
      italic:     {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip", member: "Junicode/TTF/Junicode-SemiCondLightItalic.ttf"}
      bolditalic: {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip", member: "Junicode/TTF/Junicode-SemiCondMediumItalic.ttf"}

  # S tier since 2026-08-24 — see installed_families at the top of this file.
  #
  # FLAGGED at promotion, NOT changed — awaiting an owner ruling, because the
  # fix costs bundle megabytes and he asked for a promotion, not for those.
  # This is the ONLY installed family still on `latin-ext`; the other seven are
  # all on `reading`. That is not cosmetic: fallback_chain_for() in
  # build-sd-fonts.py gives a Latin-only family its single committed face and
  # NO symbol/math/dingbat tail, so Almendra's .cpfont files carry no
  # U+2190-2193 arrows and no U+2212 MINUS. It fails
  # test/sd_font_arrows/SdFontArrowsTest (EveryInstalledFamilyDrawsRealArrowGlyphs)
  # for exactly that reason, and it is now the only INSTALLED family that does.
  # Coelacanth was raised to `reading` on 2026-08-20 over the same bug, when
  # U+2212 in a Claude reply drew tofu.
  #
  # Measured 2026-08-24, 1x raw bytes, same four sizes, same sources:
  #
  #   latin-ext         (today)     965,412   no arrows, no math
  #   latin-ext,symbols           2,910,561   arrows + math + dingbats, 3.0x
  #   reading                     4,111,496   the tier baseline, 4.3x
  #
  # At 4.3x the 1x+2x tree goes ~4.1 MB -> ~17.7 MB raw, which would put it
  # mid-pack against Edgar's 22.4 and Libris' 9.5 rather than at the bottom.
  # The rebuild itself is cheap: about 6 s per tier, sources and fallbacks all
  # cached. It is the WEIGHT that needs the ruling, not the work.
  - name: Almendra
    description: "Bookish oldstyle drawn from medieval calligraphy"
    # `reading`, not `latin-ext`, since 2026-08-24 (owner: "add coverage to
    # almendra"). A latin-ext family gets no symbol/math/dingbat tail from
    # fallback_chain_for(), so this had no arrows (U+2190-2193) and no real
    # MINUS (U+2212) -- it was the only installed family failing
    # test/sd_font_arrows, and it is exactly the bug Coelacanth was raised for
    # on 2026-08-20. Costs 0.97 -> 4.11 MB per tier, which was the owner's call
    # to make rather than mine.
    intervals: reading
    # READ BACK from the built .cpfonts on 2026-08-24, correcting a computed
    # column that was off by a pixel at two slots (it said 33/39/46/55): xh
    # 12/14/16/18 — EXACT at all four — and advY 32/39/45/55, against the
    # tier's 34/39/45/51.
    #
    # The hinted build measures ~0.55 em x-height (the old "0.485, standard
    # ramp" estimate read two slots big), and its xh curve is nonlinear: 18 px
    # needs 17 pt while 16 px needs only 14 pt, so slot 3 runs +4 px loose —
    # one span cannot fit the 14->17 pt jump. xh takes priority.
    #
    # Re-checked at promotion, because a trial's fit is allowed to be rough and
    # an installed family's is not: no `metrics:` span and no
    # `line_height_scale` fixes slot 3, since both are FAMILY-WIDE multipliers.
    # Pulling 55 down to 51 is a 0.927 factor, which would take the two exact
    # slots to 36 and 42 and slot 0 to 30. Four px loose at the largest size,
    # with three slots right, is the better page. Leave it.
    sizes: [10, 12, 14, 17]
    metrics: {ascent: 1114, descent: -429, linegap: 0}
    # raw.githubusercontent ofl/almendra paths error out; these are the static
    # TTFs the css2 API serves for ital,wght 0,400 / 0,700 / 1,400 / 1,700 —
    # all four styles are real.
    styles:
      regular:    {url: "https://fonts.gstatic.com/s/almendra/v28/H4ckBXKAlMnTn0CskyY6.ttf"}
      bold:       {url: "https://fonts.gstatic.com/s/almendra/v28/H4cjBXKAlMnTn0Cskx6G7Zu4.ttf"}
      italic:     {url: "https://fonts.gstatic.com/s/almendra/v28/H4ciBXKAlMnTn0CskxY4yLs.ttf"}
      bolditalic: {url: "https://fonts.gstatic.com/s/almendra/v28/H4chBXKAlMnTn0CskxY48Ae9oqY.ttf"}

  - name: Coelacanth
    description: "Centaur revival, Venetian oldstyle (Latin, Greek, Cyrillic)"
    # Raised to the `reading` baseline 2026-08-20 (owner ruling, triage of
    # docs/font-unicode-coverage.md): U+2212 MINUS in a Claude reply drew
    # tofu, and the split was exactly requested-intervals -- the families on
    # `reading` had the math layer, the ones on latin-ext did not. `greek` and
    # `cyrillic` stay listed because reading carries only their base blocks;
    # dropping them would silently lose polytonic Greek and Cyrillic-ext,
    # which this family HAS. The old arrow range folds into reading.
    intervals: reading,greek,cyrillic
    # Uniform slots: xh 12/14/16/18 (exact), advY 36/42/50/55, +2..+4 over
    # target: floor-bound. Coelacanth's extenders are the longest in the set —
    # plain-ink span + 0.13 em exceeds the uniform leading at every slot, so it
    # keeps the minimum ink-safe leading instead (still far tighter than the
    # old 43-64 px range).
    sizes: [13, 15, 18, 20]
    metrics: {ascent: 929, descent: -384, linegap: 0}
    # Upstream (CTAN) ships Regular/Bold/Italic but no BoldItalic, so
    # bolditalic emboldens the real Italic — never sheared. Measured: italic
    # stems 0.069 em; embolden_em 0.037 + y_ratio 0.35 lands 1.49-1.55x stems
    # with hairline growth held near stem growth (default y_ratio flattened
    # the face's contrast). See docs/synthetic-font-styles.md.
    styles:
      regular:    {url: "https://mirrors.ctan.org/fonts/coelacanth/opentype/Coelacanth.otf"}
      bold:       {url: "https://mirrors.ctan.org/fonts/coelacanth/opentype/CoelacanthBold.otf"}
      italic:     {url: "https://mirrors.ctan.org/fonts/coelacanth/opentype/CoelacanthItalic.otf"}
      bolditalic: {from: italic, synthetic: {embolden_em: 0.037, y_ratio: 0.35}}

  - name: InknutAntiqua62
    description: "Sturdy slab antiqua for literary fiction (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 11/14/16/18 (slot 0 is 1 px small — hinting skips
    # 12 px between 10 and 11 pt), advY 33/39/46/52 (+-1 rounding).
    sizes: [10, 12, 14, 16]
    # Stock vertical metrics are enormous — hhea 1703/-876 = 2.58 em line
    # height, sized for the Devanagari conjunct stacks a Latin build never
    # renders. The "62" in the family name records the first fix (a 74/62/57
    # px-leading A/B chose 62 = ink-tight 1244/-364); this span re-derives the
    # same idea against the uniform slot targets. Without an override the
    # family reads with ~60% extra leading.
    metrics: {ascent: 1203, descent: -340, linegap: 0}
    # Sourced from the foundry repo (github.com/clauseggers/Inknut-Antiqua),
    # not the Google Fonts OFL mirror — same license (OFL 1.1), but the
    # foundry repo carries the full 7-weight ladder (Light, Regular, Medium,
    # SemiBold, Bold, ExtraBold, Black) the Google mirror truncates to just
    # Regular+Bold. The family has no italics at all anywhere in the foundry
    # repo, so obliques shear the REAL weights (regular -> italic, bold ->
    # bolditalic) at a gentle 10°.
    #
    # Regular/bold pair is Light (300) + Bold (700), not Regular (400) + Bold
    # — owner ruling 2026-08-12 after building and reading three pairings on
    # device: shipped Regular+Bold, an exploratory Regular+ExtraBold, and an
    # exploratory Light+Bold. Light+Bold won. Both weights are real files,
    # never a synthesized embolden. Metrics/sizes below are unchanged by the
    # swap: Light measured to the same 13/15/17/19 px x-height ramp as
    # Regular at every slot (sxHeight 530/1000 upem vs 531/1000), so the
    # existing {ascent: 1203, descent: -340} override still applies exactly.
    styles:
      regular:    {url: "https://raw.githubusercontent.com/clauseggers/Inknut-Antiqua/master/TTF-OTF/InknutAntiqua-Light.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/clauseggers/Inknut-Antiqua/master/TTF-OTF/InknutAntiqua-Bold.ttf"}
      italic:     {from: regular, synthetic: {slant_deg: 10}}
      bolditalic: {from: bold, synthetic: {slant_deg: 10}}

  - name: InknutJunicode
    description: "Inknut Antiqua with Junicode's real cut italics (Latin)"
    # Raised to the `reading` baseline 2026-08-20 (owner ruling, triage of
    # docs/font-unicode-coverage.md) -- reading is a superset of the old
    # latin-ext + arrows, and adds the math/symbol layer (U+2212 included)
    # that drew tofu in Claude chat. The fallback chain fills what the face
    # lacks.
    intervals: reading
    # INSTALLED (owner ruling 2026-08-13). Regular = Inknut Regular, bold =
    # Inknut Bold. Italic/bolditalic are borrowed from Junicode, which ships
    # real cut italics where Inknut's foundry repo has none at any weight.
    #
    # THE ROMAN IS **Regular**, NOT Light, since 2026-08-13 -- "inknut thin is
    # too thin", owner, off a rendered roman ladder. InknutAntiqua62 still ships
    # Light and is a different family; do not "restore" this one to match it.
    #
    # ── SETTLED 2026-08-13, owner rulings off rendered inline benches ────────
    #
    #   width    Expanded (wdth 125). Condensed and SemiCondensed are OUT OF
    #            SCOPE by ruling, not merely unranked.
    #   weight   600 italic; Bold (700) + embolden bolditalic.
    #   ENLA     14
    #   scale    x1.2   (was x1.25 -- see ROUND 17 below)
    #   tracking 0 -- swept 0 to 0.05 em at 0.005 and rejected; the Expanded
    #            cut already sets at 100% of the roman's lowercase alphabet, so
    #            there is nothing for it to close.
    #   word sp. -0.07 em  (see below -- this one is not an eye ruling)
    #
    # Built from VAR/JunicodeVF-Italic.ttf rather than the named statics for
    # two reasons now: the statics are all ENLA 0, and ENLA is the axis that
    # carries the ruling; and 565 is not a named instance at all. wdth 125 /
    # wght 700 IS Junicode-ExpBoldItalic, which is what bolditalic rides.
    #
    # ── THE ITALIC IS wght 565, and the roman move is why ───────────────────
    # Rounds 15-16, 2026-08-13. Moving the roman Light -> Regular changes what
    # the italic has to match, so the italic was re-derived against it rather
    # than carried over. Measured on the .cpfont rasterisation (FreeType 150
    # dpi, the converter's quantisation, BW ink = level >= 1), ink per advance
    # against Inknut Regular:
    #
    #     wght    500     545     565     590     645     700
    #     ink    93.2%   96.9%   98.4%  100.7%  105.2%  109.5%
    #
    # Colour parity sits at ~590 and the owner ruled 565 off the rendered deck,
    # a hair light of parity. That is a REVERSAL of the old relationship, not a
    # nudge: wght 600 against Inknut Light ran 106.4% of its roman's ink, so
    # italic phrases used to sit darker than the text around them and now sit
    # slightly lighter.
    #
    # Colour is the metric, not stem width. Stem parity with Inknut Regular's
    # 0.1172 em would put the italic at ~667 -- but the page renders BW with no
    # antialiasing (GfxRenderer.cpp:512), so ink coverage is what the eye gets,
    # and design-unit stem parity is not preserved by the rasteriser.
    #
    # DO NOT re-derive this by nudging the axis: 545-575 is 30 wght units =
    # ~0.0047 em of stem = 0.10-0.16 px at these ppem, and four of the five
    # round-16 candidates render the IDENTICAL stem tuple. Adjacent steps
    # differ by ~2 000 pixels a frame while the two ends differ by 3 747 --
    # the pixels flicker rather than accumulate. Anything inside that band is
    # an eye ruling on edge quantisation and cannot be argued from numbers.
    #
    # Carried over from the Light era, and checked rather than assumed: Inknut's
    # x-height does not move with weight (Light and Regular both 0.5320 em, cap
    # 0.7870 vs 0.7860), so `ENLA: 14` still holds. (`scale:` and the word space
    # did NOT survive -- see round 17 immediately below.)
    #
    # ── ROUND 17: scale x1.25 -> x1.2, and the italic was 5% too big ────────
    # Owner off TestFlight build 70, on the phone: "the junicode italic appears
    # slightly too large compared to the inknut." Correct, and EVERY BENCH
    # BEFORE THIS ONE MISSED IT, because they all judged 1x -- where the hinter
    # compresses the italic's x-height and hides the overshoot. iOS and desktop
    # render the 2x companions, and at 2x the outline proportions come through.
    # Mean deviation from Inknut Regular over the four 2x sizes, at the old
    # x1.25:
    #
    #     x-height  +3.8%     cap +5.3%     ascender +4.6%
    #
    # Outline units agree (Junicode x 0.5813 / cap 0.8400 / asc 0.9225 per em
    # against Inknut Regular's 0.5320 / 0.7860 / 0.8730), so it is geometry,
    # not rasterisation. The "caps sit ~5% over, accepted" line further down
    # was an acceptance made on 1x proofs and is superseded.
    #
    # `scale:` is the knob because the overshoot is uniform across all three
    # metrics: ENLA moves x-height alone (caps were the worst offender) and
    # wdth moves set width, not height. All-three parity computes to x1.196;
    # the owner ruled **x1.2** off the rendered deck. At x1.2 the 2x figures
    # are x -1.0%, cap +1.2%, asc +1.1%.
    #
    # THE PRICE, ruled and accepted: at 1x the italic's x-height was already
    # short at small ppem, and shrinking costs a pixel in two slots --
    # 10 pt goes 11 -> 10 px against the roman's 13, and 16 pt goes 19 -> 18.
    # x1.208 was the only bracket value that kept the 10 pt pixel; 16 pt loses
    # it at any reduction. The device reads 1x and the phone reads 2x, and both
    # ship, so this is a real trade and not a free win.
    #
    # WEIGHT MOVED WITH IT, 565 -> 600. Shrinking the scale thins the stems:
    # wght 565 falls from 98.4% to 95.3% of the roman's ink per advance between
    # x1.25 and x1.196, nearly a whole round-16 stop. 600 at x1.2 measures
    # 98.0%, which restores the round-16 colour ruling rather than quietly
    # abandoning it. A scale change ALWAYS needs a weight re-solve; they are
    # not independent knobs.
    #
    # WORD SPACE MOVED TOO, -0.09 -> -0.07, and it was measured, not scaled.
    # The proportional formula predicted -0.076, which renders 5/7/8/8 px
    # against the roman's 6/7/8/9. -0.070 renders 6/7/8/9 -- parity at every
    # size, the same criterion round 13 used.
    #
    # ── ROUND 19 DECLINED, 2026-08-14: ENLA STAYS 14 ────────────────────────
    # The 1x and 2x cuts do not agree, and this is the ruling not to chase it.
    # The hinter pushes the two faces opposite ways at low ppem -- x-height px,
    # 2x column halved so the cuts compare directly:
    #
    #     Inknut Regular   1x 13 15 17 19   2x/2 12.0 14.0 16.0 18.5
    #     Junicode x1.2    1x 10 14 16 18   2x/2 11.5 14.0 16.0 18.5
    #
    # so at 10 pt the roman hints UP a pixel while the italic hints DOWN 1.5,
    # leaving the italic three pixels short of the roman at the smallest device
    # size. ENLA 17 (with wght re-solved to 579 to hold the colour) would make
    # that mismatch a uniform one pixel for 2.3 points of 2x x-height. Owner
    # ruled it not worth the change: "drop it -- good enough."
    #
    # Do not reopen this by "fixing" the 10 pt slot. And do NOT reach for
    # force_autohint as the alternative -- it was measured and it FAILS: it
    # fixes 1x and re-breaks 2x, because it shrinks the ROMAN at 2x as well
    # (24/28/32/37 -> 22/26/31/35), leaving the italic +7.2% on x-height there,
    # worse than the x1.25 this whole thread started from. It is also
    # family-level (build-sd-fonts.py:392) and so cannot be aimed at the
    # borrowed italic alone. Both candidates are kept as round-19 families in
    # inknut-italic-bench.yaml if the question is ever reopened.
    #
    # KNOWN MISMATCH, left as ruled: bolditalic keeps embolden 0.042, which
    # round 14 chose to land the italic->bolditalic step on the roman pair's.
    # It no longer does. Against the new pair the roman steps Regular->Bold
    # x1.296 while the italic steps 565->bolditalic x1.449; `embolden_em: 0.024`
    # would restore the match (x1.292). Owner ruled bold and bolditalic
    # untouched in this round -- so the 0.042 rationale below is HISTORY, not a
    # live derivation. Reopen it as its own round, do not silently "fix" it.
    #
    # BOLDITALIC IS wght 700 NOW, where it used to repeat the SemiBold. The old
    # reason was real but width-specific: SemiCondensed ships no Bold Italic at
    # all, and reaching into a wider cut would have changed set width mid-family.
    # At Expanded the Bold Italic exists at the family's own width, so the slot
    # gets a genuinely heavier face instead of a repeat.
    #
    # ── WORD SPACE: -0.09 em, derived not judged ────────────────────────────
    # (Derived against Inknut Light's 0.2840 em space; re-checked for Regular's
    # 0.2790 and unchanged -- both render 6/7/8/9 px.)
    # Junicode's space is 0.3555 em after the x1.25 scale against Inknut's
    # 0.2840, so an italic phrase inside an Inknut sentence opened up at every
    # word boundary while the letters sat right. Neither `scale:` nor the width
    # axis can fix that -- both move the space in proportion with everything
    # else. Rendered gap in device px:
    #
    #     word_space_em   10pt  12pt  14pt  16pt
    #     roman             6     7     8     9
    #     0 (as drawn)      7     9    10    12
    #     -0.06             6     7     9    10
    #     -0.09             6     7     8     9   <- parity at every size
    #     -0.12             5     6     7     8
    #
    # The gap snaps to a whole pixel, so -0.06 and -0.09 are indistinguishable
    # at 10 and 12 pt and only separate at 14 and 16. Do not "simplify" this to
    # -0.06 off a 12 pt proof; that is exactly the reading that missed.
    #
    # CAUTION for anyone re-running this comparison: the word-space ladder
    # rendered PIXEL-IDENTICAL at first, because render_harness.cpp measured one
    # word gap in REGULAR and reused it for every run. The reader does not --
    # ParsedText.cpp:755 asks per word style. The harness is fixed; if a spacing
    # change ever appears to do nothing, diff the frames before believing it.
    #
    # ── Superseded, kept so the path is legible ─────────────────────────────
    # Rounds 1-3 shipped SemiCondensed SemiBold at x1.33, sized on x-height
    # parity (x1.274 read small). Round 4 re-derived x1.171 from the M for exact
    # cap parity, which made the italic read short AND narrow -- one constraint,
    # two symptoms -- and rounds 7-12 let it go again. Caps now sit ~5% over the
    # roman's, accepted: Inknut's counters are small for its size, so bowl
    # parity and height parity cannot both hold, and height won.
    #
    # ── BOLDITALIC: wght 700 PLUS a synthetic embolden ─────────────────────
    # Owner ruling 2026-08-13, reversing the round-14 decline once the cause
    # was measured. wght 700 alone produced NO VISIBLE BOLD: read out of the
    # built .cpfont, wght 600 and 700 render the SAME whole-pixel stem at
    # three of the four reading sizes (2/3/4/4 px against the italic's
    # 2/3/3/4), because post-scale the axis moves the stem only 0.0187 em =
    # 0.39-0.62 px across this ppem range. The rasteriser rounds that away.
    # Inknut's own Light->Bold moves 0.0600 em, 1.25-2.0 px, clears a pixel
    # everywhere, and so always reads as bold.
    #
    # That sets a hard floor no wght value can reach: gaining a pixel at the
    # SMALLEST size needs 1/20.8 ppem = 0.048 em of extra stem, which is 2.5x
    # the entire 600->700 range. Hence synthesis, applied on top of 700 so it
    # only covers the gap the axis cannot rather than faking the whole step.
    #
    # 0.042 em chosen off a five-value bench (0.030/0.042/0.050/0.060, plus
    # 0.050 at y_ratio 0.35). It gains a pixel at ALL FOUR sizes -- 4/4/5/5 --
    # and lands the ink step on the roman's: x1.39 against Inknut's x1.40 at
    # 12 pt, x1.46 against x1.46 at 16. 0.050 with y_ratio 0.35 matched the
    # ink too; 0.042 won as the smaller intervention on outlines never drawn
    # for it.
    #
    # y_ratio is left at its 0.5 default: the horizontal stem grows twice as
    # fast as the vertical, which is what stops a faux bold eating its own
    # x-height. Do not raise it without re-measuring the x-height ramp.
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1203, descent: -340, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/clauseggers/Inknut-Antiqua/master/TTF-OTF/InknutAntiqua-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/clauseggers/Inknut-Antiqua/master/TTF-OTF/InknutAntiqua-Bold.ttf"}
      italic:     {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip",
                   member: "Junicode/VAR/JunicodeVF-Italic.ttf",
                   variable: {wght: 600, wdth: 125, ENLA: 14}, scale: 1.2, word_space_em: -0.07}
      bolditalic: {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip",
                   member: "Junicode/VAR/JunicodeVF-Italic.ttf",
                   variable: {wght: 700, wdth: 125, ENLA: 14}, scale: 1.2, word_space_em: -0.07,
                   synthetic: {embolden_em: 0.042}}

