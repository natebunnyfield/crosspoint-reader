    sizes: [10, 12, 14, 16]
    # Stock vertical metrics are enormous — hhea 1703/-876 = 2.58 em line
    # height, sized for the Devanagari conjunct stacks a Latin build never
    # renders. The "62" in the family name records the first fix (a 74/62/57
    # px-leading A/B chose 62 = ink-tight 1244/-364); this span re-derives the
