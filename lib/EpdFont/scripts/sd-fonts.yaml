      bolditalic: {url: "https://raw.githubusercontent.com/googlefonts/atkinson-hyperlegible-next/main/fonts/ttf/AtkinsonHyperlegibleNext-BoldItalic.ttf"}

  - name: LexicaUltralegible
    description: "Lexica Ultralegible, Atkinson Hyperlegible extended for reading (Latin)"
    # INSTALLED (S tier). The one sans in the installed set: Atkinson
    # Hyperlegible's letterform-disambiguation design with the coverage gap
    # closed — 100% of Latin-1 and Latin Extended-A where Atkinson's own static
    # TTFs carry 98% / 73%, so accented European text stays in the face instead
    # of falling back to Noto mid-word. `reading` rather than `latin-ext` to
    # match Edgar, the other recently-added installed family.
    intervals: reading
    # Uniform slots: xh 12/14/16/18 (exact on all four), advY 33/39/45/51.
    # Slot 0 sits 1 px under the tier's 34 and cannot be fixed: the next span
    # that reaches 34 px there pushes the other three to 40/46/52, three misses
    # instead of one. This is the hinting-skip case sd-fonts.yaml documents
    # above. The ascender/advanceY ratio (0.77-0.79) matches TeX Gyre Schola's.
    sizes: [11, 13, 15, 17]
    metrics: {ascent: 1102, descent: -339, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/jacobxperez/lexica-ultralegible/main/fonts/ttf/LexicaUltralegible-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/jacobxperez/lexica-ultralegible/main/fonts/ttf/LexicaUltralegible-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/jacobxperez/lexica-ultralegible/main/fonts/ttf/LexicaUltralegible-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/jacobxperez/lexica-ultralegible/main/fonts/ttf/LexicaUltralegible-BoldItalic.ttf"}

