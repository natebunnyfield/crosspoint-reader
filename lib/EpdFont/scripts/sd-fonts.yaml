      bold:       {url: "https://mirrors.ctan.org/fonts/poltawski/fonts/opentype/gust/poltawski/antpolt-bold.otf"}
      italic:     {url: "https://mirrors.ctan.org/fonts/poltawski/fonts/opentype/gust/poltawski/antpolt-italic.otf"}
      bolditalic: {url: "https://mirrors.ctan.org/fonts/poltawski/fonts/opentype/gust/poltawski/antpolt-bolditalic.otf"}

  - name: Junicode
    description: "Medievalist scholarly serif, semi-condensed (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 13/15/16/18 (+1 px at the two small slots — hinting
    # skips 12 and 14 px), advY 34/40/46/51 exact. The old "0.418 em x-height,
    # +2 pt ramp" estimate was wrong: the hinted build measures ~0.50 em, so
    # 14-20 pt read 2-3 px oversize. Standard ramp keeps the leading exact;
