  - name: Vollkorn
    description: "A serif for bread and butter use by Friedrich Althausen (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn%5Bwght%5D.ttf", variable: {wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn-Italic%5Bwght%5D.ttf", variable: {wght: 400}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn-Italic%5Bwght%5D.ttf", variable: {wght: 700}}

  - name: GoudyBookletter1911
    description: "Goudy's Kennerley Old Style revival, low-contrast Venetian serif (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/17/18, advY 34/39/46/51 — slot 2 lands 1 px big
    # (hinted x-height skips 16 px entirely: 15 px at 16-17 pt, 17 px at 18 pt).
    sizes: [13, 15, 18, 20]
    metrics: {ascent: 952, descent: -267, linegap: 0}
    # Upstream ships regular only; bold/italic/bolditalic are synthesized at
    # build time (embolden target ~1.55x stems, 11deg oblique like Kennerley's
    # gentle 1918 italic). Parameters derived in docs/synthetic-font-styles.md.
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/goudybookletter1911/GoudyBookletter1911.ttf"}
      bold:       {from: regular, synthetic: {embolden_em: 0.039}}
      italic:     {from: regular, synthetic: {slant_deg: 11}}
      bolditalic: {from: regular, synthetic: {embolden_em: 0.039, slant_deg: 11}}

  # Caledonia CC (Carter & Cone) - commercial, so the files are never
  # committed or distributed; the family ships Regular and Italic only (no
  # bold exists upstream), so bold/bolditalic are synthesized by emboldening
  # the real styles - never sheared, the italic is real. To build on your own
  # machine: place CaledoniaCC-TextRegular.otf and CaledoniaCC-TextItalic.otf
  # in lib/EpdFont/local_fonts/ (gitignored), uncomment this block, then run
  #   python3 build-sd-fonts.py --only CaledoniaCC
  # embolden_em starts lower than Goudy's 0.039: Caledonia's high stroke
  # contrast means hairlines gain proportionally more than stems. Judge the
  # hairline/stem relationship at 12 pt first; see docs/synthetic-font-styles.md.
  #
  - name: CaledoniaCC
    description: "Caledonia CC, Dwiggins's transitional Scotch Roman (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/16/18 (exact), advY 33/39/46/52 (+-1 rounding at
    # the ends of the 10-16 pt ramp). Caledonia is big-on-body: the old
    # 12-18 pt ramp read two slots larger than the anchor.
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1074, descent: -469, linegap: 0}
    styles:
      regular:    {path: "local_fonts/CaledoniaCC-Regular.ttf"}
      italic:     {path: "local_fonts/CaledoniaCC-Italic.ttf"}
      bold:       {from: regular, synthetic: {embolden_em: 0.045, y_ratio: 0.35}}
      bolditalic: {from: italic, synthetic: {embolden_em: 0.045, y_ratio: 0.35}}

  # The four families below are commercial or webfont cuts: the FILES are never
  # committed or distributed, only these recipes. Put the sources in
  # lib/EpdFont/local_fonts/ (gitignored) under the names below and they build
  # like any other family. Without them `install-sim-fonts.py` skips the family
  # and says so — it does NOT mean the font is missing from the card, only that
  # it cannot be regenerated here.
  #
  # Metrics were recovered from the shipped .cpfont files on 2026-08-01, not
  # re-measured: re-measuring gives different numbers (Edgar measures 987, but
  # the builds are only consistent with ~952). ascender = norm_ceil(size.ascender)
  # (fontconvert_sdcard.py:796), so four sizes pin the original to a narrow
  # range. Only Edgar needs an override; the other three already carry metrics
  # that reproduce their builds.

  - name: Edgar
    description: "Frere-Jones/Stössinger Caslon-adjacent text serif (Latin)"
    # `reading` plus ™ ℗ ℠ (0x2100-0x214F) and ə (0x0250-0x02AF), then the PUA
    # block: 'liga'/'rlig' emit f_b f_h f_j f_k f_f_b f_f_h f_f_j f_f_k (and g_y
    # in the italics) with no cmap entry, and fontconvert can only carry a
    # ligature whose OUTPUT glyph has a codepoint. The staged sources are already
    # PUA-encoded at U+E000-E008 by add_pua_ligs.py, which is what gets Edgar to
    # 13 ligature pairs (14 in the italics) instead of the bare 5.
    intervals: reading,(0x2100-0x214F),(0x0250-0x02AF),(0xE000-0xE008)
    sizes: [12, 14, 16, 18]
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — exact on all four, and
    # the ascender clears accented capitals at every size (the defect the
    # earlier 952/-284 metrics had; its 1052/-305 fix is superseded by this
    # slot-uniform span, which keeps the same clearance).
    metrics: {ascent: 1031, descent: -320, linegap: 0}
    styles:
      regular:    {path: "local_fonts/Edgar-Regular.ttf"}
      bold:       {path: "local_fonts/Edgar-Bold.ttf"}
      italic:     {path: "local_fonts/Edgar-Italic.ttf"}
      bolditalic: {path: "local_fonts/Edgar-BoldItalic.ttf"}

  - name: GTAlpinaCond
    description: "GT Alpina Condensed, tightest set in the tier (Latin)"
    intervals: reading
    sizes: [12, 14, 16, 18]
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — exact on all four.
    # The webfont cut's stock 892/-281 (ink +-65/1000) gave advY 29-44,
    # the tightest leading in the set, and its ascender sat 1 px under the
    # accented capitals at 18 pt; this span fixes both.
    metrics: {ascent: 1013, descent: -338, linegap: 0}
    styles:
      regular:    {path: "local_fonts/GTAlpinaCond-Regular.otf"}
      bold:       {path: "local_fonts/GTAlpinaCond-Bold.otf"}
      italic:     {path: "local_fonts/GTAlpinaCond-Italic.otf"}
      bolditalic: {path: "local_fonts/GTAlpinaCond-BoldItalic.otf"}

  - name: Venetian301
    description: "Bitstream's Centaur — Rogers after Jenson; italic is Warde's Arrighi (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/16/18 (exact — the old 15-21 pt ramp read up to
    # 2 px small at the top). Venetian is the smallest-on-body face in the set,
    # hence the tall ramp.
    sizes: [15, 18, 20, 23]
    # advY 38/46/51/58, +4..+7 over target: floor-bound. Rogers' long extenders
    # plus Warde's Arrighi italic put the plain-ink span + 0.13 em above the
    # uniform leading at every slot; accents may still poke 1-3 px over the
    # declared ascender (span cannot cover both, descenders win). This unifies
    # the four styles' previously differing source metrics (871/904/826/893) —
    # the decision the earlier recipe deliberately deferred.
    metrics: {ascent: 841, descent: -360, linegap: 0}
    styles:
      regular:    {path: "local_fonts/Venetian301-Regular.otf"}
      bold:       {path: "local_fonts/Venetian301-Bold.otf"}
      italic:     {path: "local_fonts/Venetian301-Italic.otf"}
      bolditalic: {path: "local_fonts/Venetian301-BoldItalic.otf"}

  - name: TeXGyreSchola
    description: "GUST's Century Schoolbook revival (Latin, Greek, Cyrillic)"
    intervals: reading
    sizes: [12, 14, 16, 18]
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — exact on all four.
    # Native 1135/-332 (1.467 em) gave the loosest leading in the set
    # (advY 37-55); this span brings it to the shared rhythm.
    metrics: {ascent: 1049, descent: -302, linegap: 0}
    # Freely licensed (GUST Font License), so this one needs no local files and
    # rebuilds on any machine.
    styles:
      regular:    {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-regular.otf"}
      bold:       {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-bold.otf"}
      italic:     {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-italic.otf"}
      bolditalic: {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-bolditalic.otf"}

  - name: Junicode
    description: "Medievalist scholarly serif, semi-condensed (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 13/15/16/18 (+1 px at the two small slots — hinting
    # skips 12 and 14 px), advY 34/40/46/51 exact. The old "0.418 em x-height,
    # +2 pt ramp" estimate was wrong: the hinted build measures ~0.50 em, so
    # 14-20 pt read 2-3 px oversize. Standard ramp keeps the leading exact;
    # the xh-exact ramp (11/13/16/18) would force advY 3 px tight at slot 1.
    sizes: [12, 14, 16, 18]
    metrics: {ascent: 991, descent: -360, linegap: 0}
    # SemiCondensed Light/Medium rather than Regular/Bold: on 2-bit e-ink the
    # Light weight reads as a book roman and Medium gives enough contrast for
    # emphasis without clogging counters at reading sizes.
    styles:
      regular:    {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip", member: "Junicode/TTF/Junicode-SemiCondLight.ttf"}
      bold:       {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip", member: "Junicode/TTF/Junicode-SemiCondMedium.ttf"}
      italic:     {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip", member: "Junicode/TTF/Junicode-SemiCondLightItalic.ttf"}
      bolditalic: {zip: "https://github.com/psb1558/Junicode-font/releases/download/v2.226/Junicode_2.226.zip", member: "Junicode/TTF/Junicode-SemiCondMediumItalic.ttf"}

  - name: Almendra
    description: "Bookish oldstyle drawn from medieval calligraphy (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/16/18 (exact), advY 33/39/46/55. The hinted build
    # measures ~0.55 em x-height (the old "0.485, standard ramp" estimate read
    # two slots big), and its xh curve is nonlinear: 18 px needs 17 pt while
    # 16 px needs only 14 pt, so slot 3 runs +4 px loose — one span cannot fit
    # the 14->17 pt jump. xh takes priority.
    sizes: [10, 12, 14, 17]
    metrics: {ascent: 1114, descent: -429, linegap: 0}
    # raw.githubusercontent ofl/almendra paths error out; these are the static
    # TTFs the css2 API serves for ital,wght 0,400 / 0,700 / 1,400 / 1,700 —
    # all four styles are real.
    styles:
      regular:    {url: "https://fonts.gstatic.com/s/almendra/v28/H4ckBXKAlMnTn0CskyY6.ttf"}
      bold:       {url: "https://fonts.gstatic.com/s/almendra/v28/H4cjBXKAlMnTn0Cskx6G7Zu4.ttf"}
      italic:     {url: "https://fonts.gstatic.com/s/almendra/v28/H4ciBXKAlMnTn0CskxY4yLs.ttf"}
      bolditalic: {url: "https://fonts.gstatic.com/s/almendra/v28/H4chBXKAlMnTn0CskxY48Ae9oqY.ttf"}

  - name: Coelacanth
    description: "Centaur revival, Venetian oldstyle (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    # Uniform slots: xh 12/14/16/18 (exact), advY 36/42/50/55, +2..+4 over
    # target: floor-bound. Coelacanth's extenders are the longest in the set —
    # plain-ink span + 0.13 em exceeds the uniform leading at every slot, so it
    # keeps the minimum ink-safe leading instead (still far tighter than the
    # old 43-64 px range).
    sizes: [13, 15, 18, 20]
    metrics: {ascent: 929, descent: -384, linegap: 0}
    # Upstream (CTAN) ships Regular/Bold/Italic but no BoldItalic, so
    # bolditalic emboldens the real Italic — never sheared. Measured: italic
    # stems 0.069 em; embolden_em 0.037 + y_ratio 0.35 lands 1.49-1.55x stems
    # with hairline growth held near stem growth (default y_ratio flattened
    # the face's contrast). See docs/synthetic-font-styles.md.
    styles:
      regular:    {url: "https://mirrors.ctan.org/fonts/coelacanth/opentype/Coelacanth.otf"}
      bold:       {url: "https://mirrors.ctan.org/fonts/coelacanth/opentype/CoelacanthBold.otf"}
      italic:     {url: "https://mirrors.ctan.org/fonts/coelacanth/opentype/CoelacanthItalic.otf"}
      bolditalic: {from: italic, synthetic: {embolden_em: 0.037, y_ratio: 0.35}}

  - name: InknutAntiqua62
    description: "Sturdy slab antiqua for literary fiction (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 11/14/16/18 (slot 0 is 1 px small — hinting skips
    # 12 px between 10 and 11 pt), advY 33/39/46/52 (+-1 rounding).
    sizes: [10, 12, 14, 16]
    # Stock vertical metrics are enormous — hhea 1703/-876 = 2.58 em line
    # height, sized for the Devanagari conjunct stacks a Latin build never
    # renders. The "62" in the family name records the first fix (a 74/62/57
    # px-leading A/B chose 62 = ink-tight 1244/-364); this span re-derives the
    # same idea against the uniform slot targets. Without an override the
    # family reads with ~60% extra leading.
    metrics: {ascent: 1203, descent: -340, linegap: 0}
    # The family has no italics at all; obliques shear the REAL weights
    # (regular -> italic, bold -> bolditalic) at a gentle 10° — sturdy antiqua,
    # so no embolden is ever synthesized on top of the real Bold.
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/inknutantiqua/InknutAntiqua-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/inknutantiqua/InknutAntiqua-Bold.ttf"}
      italic:     {from: regular, synthetic: {slant_deg: 10}}
      bolditalic: {from: bold, synthetic: {slant_deg: 10}}

  - name: LibreCaslonText
    description: "Caslon revival tuned for body text (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 11/14/16/18 (slot 0 is 1 px small — hinting skips
    # 12 px between 10 and 11 pt), advY 33/39/46/52 (+-1 rounding).
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1136, descent: -407, linegap: 0}
    # Roman is a wght 400-700 variable; italic exists only as a static 400
    # (raw path 404s — this is the css2 API's gstatic static TTF), so
    # bolditalic emboldens the real Italic — never sheared. Measured: italic
    # stems 0.109 em; embolden_em 0.055 + y_ratio 0.35 lands 1.50-1.52x stems
    # (matching the real 700/400 roman ratio of 1.50x) with contrast kept.
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librecaslontext/LibreCaslonText%5Bwght%5D.ttf", variable: {wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librecaslontext/LibreCaslonText%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://fonts.gstatic.com/s/librecaslontext/v5/DdT678IGsGw1aF1JU10PUbTvNNaDMfq91-c.ttf"}
      bolditalic: {from: italic, synthetic: {embolden_em: 0.055, y_ratio: 0.35}}

  - name: Newsreader
    description: "Editorial serif with optical sizing pinned for text (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/16/18 (exact), advY 35/40/46/51 (+1 rounding at
    # slot 0). The opsz-16 instance's stock metrics give a 1.013 em advance —
    # near-zero leading against 1.196 em of ink, 5-6 px overlap everywhere —
    # so an override is mandatory regardless of the slot targets.
    sizes: [13, 15, 17, 19]
    metrics: {ascent: 949, descent: -322, linegap: 0}
    # Both variable axes pinned: opsz 16 (text cut), wght 400/700 — all four
    # styles are real instances, nothing synthesized.
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader%5Bopsz%2Cwght%5D.ttf", variable: {opsz: 16, wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader%5Bopsz%2Cwght%5D.ttf", variable: {opsz: 16, wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader-Italic%5Bopsz%2Cwght%5D.ttf", variable: {opsz: 16, wght: 400}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader-Italic%5Bopsz%2Cwght%5D.ttf", variable: {opsz: 16, wght: 700}}

  - name: Rosarivo
    description: "Garalde bookface with calligraphic roots (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/16/18 (exact), advY 33/39/46/52 (+-1 rounding).
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1054, descent: -489, linegap: 0}
    # Upstream ships Regular and Italic only — no bold exists — so bold
    # emboldens the Regular and bolditalic emboldens the real Italic (never
    # sheared). Measured: regular stems 0.081 em, italic 0.078 em; the shared
    # embolden_em 0.043 + y_ratio 0.35 lands 1.52-1.53x (bold) / 1.51-1.63x
    # (bolditalic) stems at matching absolute weight, hairline growth below
    # stem growth on the roman (contrast preserved).
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/rosarivo/Rosarivo-Regular.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/rosarivo/Rosarivo-Italic.ttf"}
      bold:       {from: regular, synthetic: {embolden_em: 0.043, y_ratio: 0.35}}
      bolditalic: {from: italic, synthetic: {embolden_em: 0.043, y_ratio: 0.35}}

