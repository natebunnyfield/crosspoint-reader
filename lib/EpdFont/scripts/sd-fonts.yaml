  # never on one. The cut is not a finding against the face: it ran deep in the
  # blind serif bench (tools/blind-bench/), further than most of that field, and
  # round 4's page names it among the three that "didn't make round 3's cut",
  # alongside Spectral and Merriweather Light. Libris ADF won that bench and
  # took the slot. Beaten, not defective.
