    # counters intact, 99% of Latin Extended-A, a real drawn italic.
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1202, descent: -359, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librefranklin/LibreFranklin%5Bwght%5D.ttf", variable: {wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/librefranklin/LibreFranklin%5Bwght%5D.ttf", variable: {wght: 700}}
