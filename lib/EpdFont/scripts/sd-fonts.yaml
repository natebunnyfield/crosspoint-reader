  - name: Archivo
    description: "Archivo, Omnibus-Type's grotesque for text (Latin, Greek, Cyrillic)"
    intervals: reading
    # force_autohint is LOAD-BEARING, not a tweak. Under the font's native
    # hinting no point size renders a 12 px x-height at all — it jumps 11 px
    # (10 pt) straight to 13 px (11 pt) — so slot 0 had to be built a pixel
    # small, and at that size the apertures of 's' sealed shut (5 enclosed
    # pixels where an open letter must have none). The auto-hinter puts 11 pt
    # exactly on 12 px AND reopens the aperture: s = 0, and the 'e' eye goes
    # from 7 px to 26. The bench disqualified this face on the native-hinted
    # build; that verdict was an artifact of the hinter, not the design.
    force_autohint: true
    # Uniform slots: xh 12/14/16/18 exact on all four; advY 35/39/45/51,
    # slot 0 one px over (no span lands 34 there without moving the rest).
