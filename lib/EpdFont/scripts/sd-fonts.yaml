  - name: LibrisADF
    description: "ADF's Lydian revival, calligraphic humanist sans — winner of the blind serif bench, reclassified sans (Latin)"
    # RECLASSIFIED HERE from the Serif section (owner ruling 2026-08-12,
    # same day as the S-tier promotion below): this face won a SERIF bench
    # (tools/blind-bench/) but its own name table says otherwise — nameID 10,
    # "Libris is a sans serif font intented to mimic Lydian typeface" [sic] —
    # and rendering it beside TeX Gyre Schola and Coelacanth confirms it: bare
    # flared stem endings, no serifs. Lydian is a calligraphic humanist sans,
    # not the 19th-century-grotesque style Libre Franklin/Archivo/HostGrotesk
    # are. So this sits beside Libre Franklin as a SECOND installed sans, not
    # because it beat Libre Franklin at anything — it never competed against
    # it — but because the two fill different classification cells (grotesque
    # vs humanist) and a head-to-head only runs within one cell. No bench is
    # pending or expected; both stay installed permanently, same footing.
    # Raised to the `reading` baseline 2026-08-20 (owner ruling, triage of
    # docs/font-unicode-coverage.md) -- reading is a superset of the old
    # latin-ext + arrows, and adds the math/symbol layer (U+2212 included)
    # that drew tofu in Claude chat. The fallback chain fills what the face
    # lacks.
    intervals: reading
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — both rows exact on all
    # four, read back from the BUILT .cpfont files and again through
    # render_harness, not computed. The hinted x-height is exactly 1 px per
    # point from 8 to 19 pt at 150 DPI (0.480 of ppem at every one of those
    # sizes), so the slot sizes ARE the slot x-heights; the ramp only breaks at
    # 20 pt, well above slot 3. Nothing to gain from a bigger ramp: 13/15/17/20
    # measures xh 13/15/17/22 and 14/16/18/20 measures 14/16/18/22, both worse
    # on x-height AND on leading, and neither clears accented capitals.
    sizes: [12, 14, 16, 18]
    # Span 1369 (ascent 1050 = accented-cap top 985 + the 65/1000 pad exactly;
    # descent -319 against an ink bottom of -200). NOT the 1351 the bench's
    # sweep computed: 1351 is right under the header's ceil() formula but the
    # BUILT file measures advY 34/39/45/51, because FreeType rounds
    # face.size.height to whole pixels before norm_ceil sees it — the exact trap
    # the "read the shipped files" note at the top of this file warns about.
    # Sweeping spans and measuring the built .cpfont instead puts the
    # zero-error band at 1365-1373; 1369 is its centre, so a FreeType version
    # bump has 4 units of slack either way. Unlike Edgar and TeX Gyre Schola,
    # which share these four point sizes and whose slots 1-2 no span can fix,
    # here one can.
    metrics: {ascent: 1050, descent: -319, linegap: 0}
    # GPL v2+ with font exception (Libris-Std-20110117/NOTICE.txt), so like
    # TeX Gyre Schola this one needs no local files and rebuilds on any machine.
    # All four styles are real cuts. Coverage: printable ASCII + Latin-1 100%,
    # Latin Extended-A 11/128 — the same shape of gap Quattrocento Sans and
    # Freight Sans carry, so Western European text stays in one texture and
    # Polish or Czech comes from the fallback. `latin-ext` rather than
    # `reading` for that reason: `reading` would add Greek, Cyrillic and the
    # math blocks, none of which the face has, and the fallback is Libre
    # Franklin.
    #
    # Cap-I and lowercase-l are the same bare stem, so "Ill" renders as three
    # identical bars. Noted and ruled fine (owner call 2026-08-12) — not worth
    # acting on.
    #
    # KERNING: this is the ONE installed family that ships its pairs TWICE —
    # 1053 byte-identical pairs in both the legacy `kern` table and the GPOS
    # kern feature (verified across all four styles). extract_kerning_fonttools
    # used to SUM the two, so every kerned pair came out at 2x the designer's
    # value: T+o -214/1000 em instead of -107, and at 18 pt To/Yo/Ta/Te/Tr/Ya/Ye
    # ALL saturated the int8_t 4.4 floor at -8.0 px. Fixed in the converter
    # (GPOS now overlays the legacy table instead of summing), NOT here — the
    # recipe is unchanged. **Any LibrisADF .cpfont built before that fix is
    # wrong and must be rebuilt**; a card carrying one cannot be told apart by
    # filename or size, only by reading its kern matrix back. Bench comparison:
    # lib/EpdFont/scripts/libris-kern-bench.yaml.
    styles:
      regular:    {url: "https://salsa.debian.org/fonts-team/fonts-adf/-/raw/master/Libris-Std-20110117/OTF/LibrisADFStd-Regular.otf"}
      bold:       {url: "https://salsa.debian.org/fonts-team/fonts-adf/-/raw/master/Libris-Std-20110117/OTF/LibrisADFStd-Bold.otf"}
      italic:     {url: "https://salsa.debian.org/fonts-team/fonts-adf/-/raw/master/Libris-Std-20110117/OTF/LibrisADFStd-Italic.otf"}
      bolditalic: {url: "https://salsa.debian.org/fonts-team/fonts-adf/-/raw/master/Libris-Std-20110117/OTF/LibrisADFStd-BoldItalic.otf"}

  - name: TeXGyreHeros
    description: "GUST's Helvetica revival, via URW Nimbus Sans (Latin)"
    # HI-RES TIERS NEED --drop-codepoints 0x2E3B. At the 3x tier the 16 pt slot
    # rasterises as 48 pt, and Heros' THREE-EM DASH comes out 276 px wide --
    # over the 255 px ceiling of EpdGlyph's uint8 width, so the whole size
    # fails to build. Measured 2026-08-23 while seeding the iOS bundle, which
    # is the only surface that reads a hi-res tier; the device reads 1x and is
    # unaffected. It is a per-build flag rather than a family drop_codepoints
    # because the glyph is perfectly fine at 1x and 2x, and dropping it there
    # would cost the dash for no reason:
    #   build-sd-fonts.py --only TeXGyreHeros --scale 3 --drop-codepoints 0x2E3B
    intervals: reading
    # Same foundry, same license and same URL pattern as TeX Gyre Schola in the
    # Serif section — GUST Font License, four real cuts on CTAN — so like Schola
    # and Libris this one needs no local files and rebuilds on any machine.
    #
    # cmap coverage (regular, read from the shipped OTF): Latin-1 223/224,
    # Latin Extended-A 124/128, Latin Extended-B 51/208, Greek 54/144
    # (symbol-adjacent only), Cyrillic 0/256, 1087 codepoints total. `reading`
    # still asks for Greek, Cyrillic and the math/symbol blocks; the fallback
    # chain fills them, exactly as it does for Antpolt, whose GUST-built cmap
    # has the same shape. The description says Latin for that reason and does
    # not claim the two scripts the face does not have. The absent Cyrillic is
    # upstream policy, not an oversight worth chasing: qhv-hist.txt records
    # that the base-35 Cyrillic was Valek Filippov's GPL addition, that GUST
    # could not obtain his permission to relicense it, and "thus there are no
    # Cyrillic glyphs in any of the TeX Gyre fonts". Measured, that is exactly
    # true — TeX Gyre Schola's own cmap is 54/144 Greek and 0/256 Cyrillic,
    # byte-for-byte the same 1087 codepoints as this face, so the Cyrillic in
    # ITS description above has always come from the fallback too. Left as it
    # stands; correcting another family's description is not this recipe's job.
    #
    # force_autohint is LOAD-BEARING, the same way it is for Archivo above,
    # though for the milder of the two reasons. Under the font's native hinting
    # the x-height ramp SKIPS 16 px: 14 pt renders 15 and 15 pt renders 17, so
    # slot 2 could only be built a pixel small or a pixel large and no metrics
    # override moves it (the span sets leading, not glyph size). The auto-hinter
    # puts 14 pt exactly on 16 px and lands all four slots. Unlike Archivo it
    # rescues no counters, because none were shut: enclosed-pixel counts for
    # s/e/a at all four sizes are equal or better under the auto-hinter
    # (s = 0 enclosed either way — that aperture is open at every slot — and the
    # 12 pt 'e' eye goes 17 -> 23 px). It is here for the ramp alone.
    force_autohint: true
    # Uniform slots: xh 12/14/16/18 exact on all four; advY 35/39/45/51. Slots
    # 1-3 are the shipped Edgar/TeXGyreSchola cluster exactly and slot 0 is one
    # px over it — the same landing Archivo gets from the same four point sizes,
    # and for the same reason: at 11 pt one pixel of leading costs ~44 units of
    # span, so every span that lands 34 at slot 0 drags the rest down with it
    # (the 34 band measures 37/43/49 through 38/44/50).
    sizes: [11, 12, 14, 16]
    # Span 1542, read back from the BUILT files and NOT computed: the header's
    # ceil() formula puts the 35/39/45/51 band at 1520-1527, and it is wrong by
    # 20 units, because FreeType rounds face.size.height to whole pixels before
    # norm_ceil sees it. Sweeping spans and measuring what the converter
    # actually writes puts the band at 1540-1545; 1542 is its center, so a
    # FreeType version bump has two units of slack below and three above.
    # Same trap, same remedy, as the LibrisADF note above.
    #
    # The split: ascent 1026 is the accented-capital ink top (961) plus the
    # 65/1000 pad exactly, so ÁÉÍÓÚ clear the declared ascender; descent -516
    # takes the remainder, against a plain-text ink bottom of -219 across all
    # four styles. Well clear of the leading floor, which is only 1096 here
    # (ink 747/-219 plus 0.13 em) — this face's line span is set by the small
    # point sizes its large x-height forces, not by its ink.
    metrics: {ascent: 1026, descent: -516, linegap: 0}
    styles:
      regular:    {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-regular.otf"}
      bold:       {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-bold.otf"}
      italic:     {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-italic.otf"}
      bolditalic: {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-bolditalic.otf"}

