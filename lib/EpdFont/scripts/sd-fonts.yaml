    # Edgar/TeX Gyre Schola's 34/39/45/51, just overshooting on the last slot
    # instead of undershooting. Ascent floor (969) clears accented capitals
    # (Ä top 902/1000 em + the tier's 65/1000 em pad).
    metrics: {ascent: 969, descent: -289, linegap: 0}
    # Freely licensed (GUST Font License), so this one needs no local files and
    # rebuilds on any machine. Source: CTAN `poltawski` package v1.101, the
