# SD Card Font Families for CrossPoint Reader
#
# This file is the single source of truth for which fonts are generated,
# how they're sourced, and how they're described in the download manifest.
#
# Adding a new font family = adding a block here. No code changes needed.
#
# Fields:
#   name:        Output family name (used in filenames and on-device UI)
#   description: Human-readable description (shown in download UI and manifest)
#   intervals:   Comma-separated Unicode interval presets for fontconvert_sdcard.py
#   sizes:       Point sizes to generate
#   force_autohint: (optional) Force FreeType auto-hinter instead of native hinting
#   metrics:     (optional) Vertical-metrics override, {ascent, descent, linegap}
#                in font units per 1000 upem (descent negative, hhea convention;
#                linegap defaults to 0). Rewrites hhea + OS/2 typo + OS/2 win on
#                a cached copy of the source (patched_fonts/, gitignored) before
#                conversion — the .cpfont's advanceY derives from hhea. For faces
#                whose stock metrics are sized for scripts the built charset
#                never includes.
#   drop_codepoints: (optional) Codepoints to delete from the source's cmap
#                before conversion, so the Noto fallback supplies them. For
#                sources whose cmap points at the WRONG outline: the converter
#                falls back only when get_char_index() returns 0, so a
#                codepoint mapped to a real-but-wrong glyph renders that glyph
#                and never falls back — and the font holds no correct outline
#                to re-point at. Narrowing `intervals:` does NOT do this: a
#                codepoint outside every interval is dropped from the build
#                entirely rather than fallen back. Not a styling knob; requires
#                a rendered contact sheet showing the wrong letter.
#   styles:      Map of style name -> font source
#                  scale: (optional) multiplier on rendered glyph size for THIS
#                    style only -- 1.27 renders every glyph 27% bigger at a
#                    given point size. Shrinks head.unitsPerEm and touches
#                    nothing else, so outlines, advances and GPOS kern keep
#                    their proportions and grow together. For MIXED-SOURCE
#                    families whose roman and italic come from different
#                    typefaces and so were never drawn to a shared x-height;
#                    `metrics:` cannot do this, as it sets line spacing rather
#                    than glyph size. Applied before drops/metrics, and
#                    inherited by any `from:` style. Not a styling knob:
#                    requires a measured x-height mismatch against the style
#                    it sits beside.
#                  path: relative to lib/EpdFont (for committed fonts)
#                  url:  download URL (for fonts not in the repo)
#                  zip + member: release-archive URL plus the font's path inside
#                  it, for foundries that only publish a whole-family zip
#                  from + synthetic: synthesize the style at build time from
#                  another style's font file (for families that ship fewer
#                  real styles than the reader uses). `from:` names the base
#                  style; `synthetic:` gives the parameters:
#                    embolden_em: stem weight to add, as a fraction of the em
#                                 (per-size pixel strength = embolden_em x ppem)
#                    y_ratio:     vertical strength as a fraction of the
#                                 horizontal (default 0.5 - full vertical
#                                 growth eats x-height and closes counters)
#                    slant_deg:   oblique shear angle for synthetic italics;
#                                 omit when the family has a real italic
#                  See docs/synthetic-font-styles.md for how the parameters
#                  were derived and the acceptance criteria.
#
# Variable fonts:
#   Some fonts (Bitter, Inter, Alegreya) are distributed as variable fonts.
#   freetype-py can't set variable font axis values, so the build script
#   uses fonttools.instancer to extract static instances automatically.
#
#   To use a variable font, add a 'variable' key to the style spec with
#   axis values to pin:
#
#     styles:
#       regular: {url: "https://...Font[wght].ttf", variable: {wght: 400}}
#       bold:    {url: "https://...Font[wght].ttf", variable: {wght: 700}}
#
#   Extracted static fonts are cached in instanced_fonts/ (gitignored).
#   Requires fonttools: pip install -r requirements.txt
#
# Slot uniformity (2026-08-02, curated reader families):
#   The four sizes of every curated family are chosen so the same ordinal
#   slot shows the same MEASURED letter size and leading, not the same
#   nominal point size:
#     x-height  12 / 14 / 16 / 18 px   (slots 0-3, regular style)
#     advanceY  34 / 40 / 46 / 51 px
#   metrics overrides implement the leading: the .cpfont's
#   advanceY = ceil((ascent - descent)/1000 * pt * 150/72). Two floors bound
#   it per family: advanceY never drops below the worst-style plain-text ink
#   span + 0.13 em (the +-65/1000 rule from the earlier ink-tight passes),
#   and the declared ascender clears accented capitals wherever the span
#   allows. Long-extender faces (Coelacanth, Venetian 301) end up a few px
#   looser than target; that is ink, not drift. Where hinting skips a pixel
#   value entirely, a slot may sit +-1 px off target (noted per family).
#   Derivation: every family swept at 9-24 pt, x-height/ink measured from
#   the built .cpfonts (2026-08-02); supersedes the source-unit "harmonized
#   ramp" x-height estimates, which hinting made wrong by up to 3 px.
#
#   The advanceY line above is the TARGET; read the shipped files before
#   matching a new family to it. Edgar and TeX Gyre Schola both build to
#   34/39/45/51, not 34/40/46/51 — slots 1 and 2 land a pixel under and no
#   span fixes only those two. Rosarivo is 32/39/45/51, Coelacanth 36/41/49/55
#   (floor-bound). The formula is also not plain ceil(): FreeType rounds
#   face.size.height to whole pixels before fontconvert's norm_ceil sees it,
#   so a span has to be checked against the built file, not computed.

# The S-tier ruling (docs/sd-card-fonts.md, 2026-08-02; Lexica Ultralegible
# added 2026-08-03, three text grotesques the same day, two of those three cut
# 2026-08-04, Lexica Ultralegible itself cut 2026-08-04, Quattrocento Sans
# promoted 2026-08-04, TeX Gyre Heros added 2026-08-23, Almendra added
# 2026-08-24): these eight, and only these eight, are INSTALLED on every surface — both device SD cards, the
# simulator's fs_/fonts/, and the iOS bundled seed set. Everything else below stays a buildable recipe that ships
# nowhere.
#
# Quattrocento Sans came in on 2026-08-04 in the same ruling that cut Freight
# Sans to C. The two were built the same day and fill the same cell — humanist
# sans — so the tier takes one of them, and it is the OFL one that rebuilds from
# a URL on any machine, audits clean, and carries the set's richest kern data.
# Freight Sans' recipe and picker label stay; its .cpfont files are gone from
# every surface.
#
# Archivo and Host Grotesk were cut on 2026-08-04 and Libre Franklin kept as the
# single text grotesque. Three faces off one bench was three answers to one
# question: they sit in the same slot in the taxonomy (19th-century grotesque
# for continuous text) and a picker that offers three of them spends the reader's
# attention on a distinction the page does not make. Archivo also carried the
# only force_autohint in the set and an 11 px x-height at slot 0 against the
# tier's 12 — see its recipe comment and tools/grotesque-bench.
#
# Lexica Ultralegible was cut the same day, leaving Libre Franklin the only sans
# until Quattrocento Sans joined it later that day. It came off the
# humanist/accessibility bench
# (lib/EpdFont/scripts/sans-candidates.yaml) and won it; the cut is a demotion to
# buildable-only, NOT a finding against the face. Its recipe below and its picker
# label in src/FontDisplayNames.h both stay, because a card provisioned before
# this ruling still carries the family. Do not "restore" it to this list — that
# would be a regression, not a fix.
#
# This list exists so the ruling is ENFORCED rather than merely documented.
# scripts/install-sim-fonts.py defaults to it; before it did, the default was
# "every curated family sd-fonts.yaml can build", which by 2026-08-01 meant all
# 15 — so a routine re-run silently reinstalled the ones the ruling excludes.
# The iOS side needs no equivalent list: CrossPointFsPrep.cpp seeds whatever
# ios/seedfonts/ contains and prunes the rest, so that directory is its own
# source of truth — delete any cut family from it by hand, since nothing in this
# repo can reach it.
#
# build-sd-fonts.py reads only `families:` and ignores this key.
installed_families:
  - Edgar
  - Coelacanth
  - TeXGyreSchola
  - LibreFranklin
  - LibrisADF
  - InknutJunicode
  - TeXGyreHeros
  - Almendra
# Almendra joined on 2026-08-24 (owner ruling: "keep almendra but add in
# accurate dates and authors"), out of the five-family trial the simulator
# repo's docs/trial-fonts.md describes; the other four were declined the same
# day. It is the eighth installed family and the
# first bookish oldstyle drawn from calligraphy rather than from metal type, so
# it displaces nothing in the tier and no head-to-head is owed.
#
# Its measured slots are the reason it survived the trial: x-height 12/14/16/18,
# EXACT at all four, which only Edgar, TeX Gyre Schola, Libris and TeX Gyre
# Heros also manage. advanceY reads back 32/39/45/55 against the tier's
# 34/39/45/51 -- slots 1 and 2 exact, slot 0 two tight and slot 3 four loose --
# and NO span fixes that, because `metrics:` and `line_height_scale` are both
# family-wide multipliers and moving slot 3 down by 4 px would drag the two
# exact slots off with it. The recipe's own comment carries the derivation.
# TeXGyreHeros joined on 2026-08-23 (owner ruling: "add TeX Gyre Heros fully to
# app as s tier candidate"). It is the second GUST e-foundry face in the tier
# and the third installed sans: a Helvetica lineage reached through URW Nimbus
# Sans, which is a neo-grotesque and therefore its own classification cell —
# neither Libre Franklin's 19th-century grotesque nor Libris' calligraphic
# humanist, so it displaces neither and no head-to-head is owed. Its recipe in
# the Sans-serif section carries the slot derivation and the one thing worth
# knowing before touching it: force_autohint is load-bearing, because the
# native ramp cannot render a 16 px x-height at any point size.
# InknutJunicode joined on 2026-08-13 (owner ruling: "add inknutjunicode fully
# to builds"), after fourteen rounds of bench work settled its borrowed italic —
# Junicode Expanded SemiBold at ENLA 14, x1.25, word space -0.09 em. It is the
# first installed family whose roman and italic come from DIFFERENT typefaces,
# so it is also the first whose italic fit had to be constructed rather than
# inherited; the recipe below carries the derivation and the accepted tradeoffs.
# LibrisADF joined on 2026-08-12 (owner ruling; see docs/sd-card-fonts.md),
# promoted straight out of tools/blind-bench as the best of that bench's
# fourteen, in the same ruling that cut Merriweather, Accanthis and Spectral
# to C.
# Rosarivo and QuattrocentoSans were A tier'd on 2026-08-07 (owner ruling) and
# deleted from every surface. Their recipes below stay buildable and their
# picker labels stay in src/FontDisplayNames.h, exactly as for the C tier cuts —
# a card provisioned before the ruling still carries them. Putting either back
# in this list is a regression, not a restoration; it needs a fresh ruling.

families:
  # ── Serif ──────────────────────────────────────────────────────────────

  - name: Literata
    description: "Screen-optimized serif (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-BoldItalic.ttf"}

  - name: SourceSerif4
    description: "Adobe transitional serif (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — exact on all four.
    # This family is the historical anchor the slot targets were drawn from.
    sizes: [12, 14, 16, 18]
    metrics: {ascent: 1009, descent: -342, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/adobe-fonts/source-serif/release/TTF/SourceSerif4-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/adobe-fonts/source-serif/release/TTF/SourceSerif4-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/adobe-fonts/source-serif/release/TTF/SourceSerif4-It.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/adobe-fonts/source-serif/release/TTF/SourceSerif4-BoldIt.ttf"}

  - name: NotoSerifExtended
    description: "Serif (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/notofonts/NotoSerif/main/fonts/ttf/unhinted/instance_ttf/NotoSerif-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/notofonts/NotoSerif/main/fonts/ttf/unhinted/instance_ttf/NotoSerif-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/notofonts/NotoSerif-Italic/main/fonts/ttf/unhinted/instance_ttf/NotoSerif-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/notofonts/NotoSerif-Italic/main/fonts/ttf/unhinted/instance_ttf/NotoSerif-BoldItalic.ttf"}

  - name: Merriweather
    description: "Warm serif for long-form reading (Latin, Cyrillic)"
    intervals: latin-ext,cyrillic
    # Uniform slots: xh 12/14/16/18 (exact), advY 34/41/45/51 (+1 at slot 1).
    # From tools/blind-bench/sweep_blind.py; see blind_slots.json. Its advY
    # column is COMPUTED from the span, not read back from a built .cpfont, and
    # the one row since checked against real files was wrong (LibrisADF's,
    # predicted 34/40/46/51 at the bench's span, built files measure
    # 34/39/45/51). This row has not been re-measured either way.
    # C tier (owner ruling 2026-08-12): cut from tools/blind-bench/
    # blind-candidates.yaml's 14-family keepers list when LibrisADF went to
    # S tier. Bundled again for the 2026-08-23 iOS trial and cut again on
    # 2026-08-24 ("lose arvo and the other candidate fonts") — out of the
    # seed tree and out of CROSSPOINT_IOS_TRIAL_FAMILIES, recipe and picker
    # label kept. Two rulings against it now; do not bundle a third time
    # without one for it.
    sizes: [10, 12, 13, 15]
    metrics: {ascent: 1102, descent: -522, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/SorkinType/Merriweather/master/fonts/ttf/Merriweather-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/SorkinType/Merriweather/master/fonts/ttf/Merriweather-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/SorkinType/Merriweather/master/fonts/ttf/Merriweather-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/SorkinType/Merriweather/master/fonts/ttf/Merriweather-BoldItalic.ttf"}

  - name: Lora
    description: "Calligraphic serif for literary reading (Latin, Cyrillic)"
    intervals: latin-ext,cyrillic
    # Uniform slots: xh 12/14/16/17, advY 34/40/46/50 — slot 3 sits 1 px small
    # and tight because Lora's hinted x-height jumps 17 -> 19 px between 16 and
    # 18 pt; 16 pt is the closer landing.
    sizes: [11, 13, 15, 16]
    metrics: {ascent: 1113, descent: -358, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/cyrealtype/Lora-Cyrillic/main/fonts/ttf/Lora-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/cyrealtype/Lora-Cyrillic/main/fonts/ttf/Lora-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/cyrealtype/Lora-Cyrillic/main/fonts/ttf/Lora-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/cyrealtype/Lora-Cyrillic/main/fonts/ttf/Lora-BoldItalic.ttf"}

  - name: GentiumBookPlus
    description: "Scholarly serif with wide Unicode coverage (Latin, Greek, Cyrillic, IPA)"
    intervals: latin-ext,greek,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/gentiumbookplus/GentiumBookPlus-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/gentiumbookplus/GentiumBookPlus-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/gentiumbookplus/GentiumBookPlus-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/gentiumbookplus/GentiumBookPlus-BoldItalic.ttf"}

  - name: IBMPlexSerif
    description: "Professional serif (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexserif/IBMPlexSerif-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexserif/IBMPlexSerif-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexserif/IBMPlexSerif-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexserif/IBMPlexSerif-BoldItalic.ttf"}

  - name: Bitter
    description: "Slab serif designed for e-ink (Latin, Cyrillic)"
    intervals: latin-ext,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf", variable: {wght: 500}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter-Italic%5Bwght%5D.ttf", variable: {wght: 500}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter-Italic%5Bwght%5D.ttf", variable: {wght: 700}}

  # TRIAL, 2026-08-23 (owner: "without committing it to s tier, quickly and
  # minimally add arvo and merriweather and Almendra to a testflight build for
  # my to check out"). The other three trial faces already had recipes here —
  # this is the only one that did not. Deliberately UNTUNED: no metrics: span,
  # so the slots land where the face's own hhea puts them rather than on the
  # tier's shared 12/14/16/18 x-height rhythm.
  #
  # READ BACK from the built .cpfonts (not computed from the span — that column
  # has been wrong before, see the caveat on Merriweather above): xh
  # 13/15/17/19 and advY 31/36/41/46, against the tier's 12/14/16/18 and
  # 34/39/45/51. So Arvo runs ONE PIXEL LARGE at every slot and 3-5 px TIGHT at
  # every slot at once — a page that is both bigger and more closely set than
  # anything installed, which is most of what a slab serif's density reads as.
  # That was the trial's finding, not a defect.
  #
  # C tier (owner ruling 2026-08-24, "lose arvo and the other candidate
  # fonts"): the trial ended without a promotion. Its .cpfont tree came out of
  # the iOS seed set and its name out of CROSSPOINT_IOS_TRIAL_FAMILIES; this
  # recipe and its picker label in src/FontDisplayNames.h stay, exactly as for
  # every other cut, so the face is not deleted from the project. It was never
  # in installed_families, so there is nothing to delete from a device card.
  # Putting it into installed_families is a promotion, not a restoration, and
  # needs a fresh ruling. No span was ever fitted, so it would still be
  # untuned.
  - name: Arvo
    description: "Geometric slab serif for screen reading (Latin)"
    intervals: latin-ext
    sizes: [12, 14, 16, 18]
    # All four styles are real; Arvo ships no variable axis.
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/arvo/Arvo-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/arvo/Arvo-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/arvo/Arvo-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/arvo/Arvo-BoldItalic.ttf"}

  - name: Domitian
    description: "A humanist serif for literary reading (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://mirrors.ctan.org/fonts/domitian/opentype/Domitian-Roman.otf"}
      bold:       {url: "https://mirrors.ctan.org/fonts/domitian/opentype/Domitian-Bold.otf"}
      italic:     {url: "https://mirrors.ctan.org/fonts/domitian/opentype/Domitian-Italic.otf"}
      bolditalic: {url: "https://mirrors.ctan.org/fonts/domitian/opentype/Domitian-BoldItalic.otf"}

  - name: LibreBaskerville
    description: "A serif reimplementing the classic Baskerville (Latin)"
    intervals: latin-ext
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/impallari/Libre-Baskerville/master/fonts/ttf/LibreBaskerville-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/impallari/Libre-Baskerville/master/fonts/ttf/LibreBaskerville-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/impallari/Libre-Baskerville/master/fonts/ttf/LibreBaskerville-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/impallari/Libre-Baskerville/master/fonts/ttf/LibreBaskerville-BoldItalic.ttf"}

  - name: Vollkorn
    description: "A serif for bread and butter use by Friedrich Althausen (Latin, Greek, Cyrillic)"
    intervals: latin-ext,greek,cyrillic
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn%5Bwght%5D.ttf", variable: {wght: 400}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn-Italic%5Bwght%5D.ttf", variable: {wght: 400}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/vollkorn/Vollkorn-Italic%5Bwght%5D.ttf", variable: {wght: 700}}

  - name: GoudyBookletter1911
    description: "Goudy's Kennerley Old Style revival, low-contrast Venetian serif (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/17/18, advY 34/39/46/51 — slot 2 lands 1 px big
    # (hinted x-height skips 16 px entirely: 15 px at 16-17 pt, 17 px at 18 pt).
    sizes: [13, 15, 18, 20]
    metrics: {ascent: 952, descent: -267, linegap: 0}
    # Upstream ships regular only; bold/italic/bolditalic are synthesized at
    # build time (embolden target ~1.55x stems, 11deg oblique like Kennerley's
    # gentle 1918 italic). Parameters derived in docs/synthetic-font-styles.md.
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/goudybookletter1911/GoudyBookletter1911.ttf"}
      bold:       {from: regular, synthetic: {embolden_em: 0.039}}
      italic:     {from: regular, synthetic: {slant_deg: 11}}
      bolditalic: {from: regular, synthetic: {embolden_em: 0.039, slant_deg: 11}}

  # Caledonia CC (Carter & Cone) - commercial, so the files are never
  # committed or distributed; the family ships Regular and Italic only (no
  # bold exists upstream), so bold/bolditalic are synthesized by emboldening
  # the real styles - never sheared, the italic is real. To build on your own
  # machine: place CaledoniaCC-TextRegular.otf and CaledoniaCC-TextItalic.otf
  # in lib/EpdFont/local_fonts/ (gitignored), uncomment this block, then run
  #   python3 build-sd-fonts.py --only CaledoniaCC
  # embolden_em starts lower than Goudy's 0.039: Caledonia's high stroke
  # contrast means hairlines gain proportionally more than stems. Judge the
  # hairline/stem relationship at 12 pt first; see docs/synthetic-font-styles.md.
  #
  - name: CaledoniaCC
    description: "Caledonia CC, Dwiggins's transitional Scotch Roman (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/16/18 (exact), advY 33/39/46/52 (+-1 rounding at
    # the ends of the 10-16 pt ramp). Caledonia is big-on-body: the old
    # 12-18 pt ramp read two slots larger than the anchor.
    sizes: [10, 12, 14, 16]
    metrics: {ascent: 1074, descent: -469, linegap: 0}
    styles:
      regular:    {path: "local_fonts/CaledoniaCC-Regular.ttf"}
      italic:     {path: "local_fonts/CaledoniaCC-Italic.ttf"}
      bold:       {from: regular, synthetic: {embolden_em: 0.045, y_ratio: 0.35}}
      bolditalic: {from: italic, synthetic: {embolden_em: 0.045, y_ratio: 0.35}}

  # The four families below are commercial or webfont cuts: the FILES are never
  # committed or distributed, only these recipes. Put the sources in
  # lib/EpdFont/local_fonts/ (gitignored) under the names below and they build
  # like any other family. Without them `install-sim-fonts.py` skips the family
  # and says so — it does NOT mean the font is missing from the card, only that
  # it cannot be regenerated here.
  #
  # Metrics were recovered from the shipped .cpfont files on 2026-08-01, not
  # re-measured: re-measuring gives different numbers (Edgar measures 987, but
  # the builds are only consistent with ~952). ascender = norm_ceil(size.ascender)
  # (fontconvert_sdcard.py:796), so four sizes pin the original to a narrow
  # range. Only Edgar needs an override; the other three already carry metrics
  # that reproduce their builds.

  - name: Edgar
    description: "Frere-Jones/Stössinger Caslon-adjacent text serif (Latin)"
    # `reading` plus ™ ℗ ℠ (0x2100-0x214F) and ə (0x0250-0x02AF), then the PUA
    # block: 'liga'/'rlig' emit f_b f_h f_j f_k f_f_b f_f_h f_f_j f_f_k (and g_y
    # in the italics) with no cmap entry, and fontconvert can only carry a
    # ligature whose OUTPUT glyph has a codepoint. The staged sources are already
    # PUA-encoded at U+E000-E008 by add_pua_ligs.py, which is what gets Edgar to
    # 13 ligature pairs (14 in the italics) instead of the bare 5.
    intervals: reading,(0x2100-0x214F),(0x0250-0x02AF),(0xE000-0xE008)
    sizes: [12, 14, 16, 18]
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — exact on all four, and
    # the ascender clears accented capitals at every size (the defect the
    # earlier 952/-284 metrics had; its 1052/-305 fix is superseded by this
    # slot-uniform span, which keeps the same clearance).
    metrics: {ascent: 1031, descent: -320, linegap: 0}
    styles:
      regular:    {path: "local_fonts/Edgar-Regular.ttf"}
      bold:       {path: "local_fonts/Edgar-Bold.ttf"}
      italic:     {path: "local_fonts/Edgar-Italic.ttf"}
      bolditalic: {path: "local_fonts/Edgar-BoldItalic.ttf"}

  - name: GTAlpinaCond
    description: "GT Alpina Condensed, tightest set in the tier (Latin)"
    intervals: reading
    sizes: [12, 14, 16, 18]
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — exact on all four.
    # The webfont cut's stock 892/-281 (ink +-65/1000) gave advY 29-44,
    # the tightest leading in the set, and its ascender sat 1 px under the
    # accented capitals at 18 pt; this span fixes both.
    metrics: {ascent: 1013, descent: -338, linegap: 0}
    styles:
      regular:    {path: "local_fonts/GTAlpinaCond-Regular.otf"}
      bold:       {path: "local_fonts/GTAlpinaCond-Bold.otf"}
      italic:     {path: "local_fonts/GTAlpinaCond-Italic.otf"}
      bolditalic: {path: "local_fonts/GTAlpinaCond-BoldItalic.otf"}

  - name: Venetian301
    description: "Bitstream's Centaur — Rogers after Jenson; italic is Warde's Arrighi (Latin)"
    intervals: latin-ext
    # Uniform slots: xh 12/14/16/18 (exact — the old 15-21 pt ramp read up to
    # 2 px small at the top). Venetian is the smallest-on-body face in the set,
    # hence the tall ramp.
    sizes: [15, 18, 20, 23]
    # advY 38/46/51/58, +4..+7 over target: floor-bound. Rogers' long extenders
    # plus Warde's Arrighi italic put the plain-ink span + 0.13 em above the
    # uniform leading at every slot; accents may still poke 1-3 px over the
    # declared ascender (span cannot cover both, descenders win). This unifies
    # the four styles' previously differing source metrics (871/904/826/893) —
    # the decision the earlier recipe deliberately deferred.
    metrics: {ascent: 841, descent: -360, linegap: 0}
    styles:
      regular:    {path: "local_fonts/Venetian301-Regular.otf"}
      bold:       {path: "local_fonts/Venetian301-Bold.otf"}
      italic:     {path: "local_fonts/Venetian301-Italic.otf"}
      bolditalic: {path: "local_fonts/Venetian301-BoldItalic.otf"}

  - name: TeXGyreSchola
    description: "GUST's Century Schoolbook revival (Latin, Greek, Cyrillic)"
    intervals: reading
    sizes: [12, 14, 16, 18]
    # Uniform slots: xh 12/14/16/18, advY 34/40/46/51 — exact on all four.
    # Native 1135/-332 (1.467 em) gave the loosest leading in the set
    # (advY 37-55); this span brings it to the shared rhythm.
    metrics: {ascent: 1049, descent: -302, linegap: 0}
    # Freely licensed (GUST Font License), so this one needs no local files and
    # rebuilds on any machine.
    styles:
      regular:    {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-regular.otf"}
      bold:       {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-bold.otf"}
      italic:     {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-italic.otf"}
      bolditalic: {url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-bolditalic.otf"}

