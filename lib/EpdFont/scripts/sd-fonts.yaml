    # Cyrillic (2/256) and only sparse Greek (54/144, symbol-adjacent) despite
    # `reading` requesting both — those fall back to Noto same as any gap.
    intervals: reading
    sizes: [13, 15, 17, 20]
    # Uniform-slot sweep (tools/ methodology, see docs/sd-card-fonts.md): xh
    # 12/14/16/18 exact. advY lands 34/39/45/52, not the 34/40/46/51 target —
