  # ── Sans-serif ─────────────────────────────────────────────────────────

  # The text grotesques (2026-08-03), promoted out of grotesque-candidates.yaml
  # after the bench; only Libre Franklin is still installed. Built to the same uniform slots
  # as the rest of the installed set: x-height 12/14/16/18 px measured on the
  # hinted render, advanceY against the tier's shipped 34/39/45/51.

  - name: Archivo
    description: "Archivo, Omnibus-Type's grotesque for text (Latin, Greek, Cyrillic)"
    intervals: reading
    # force_autohint is LOAD-BEARING, not a tweak. Under the font's native
    # hinting no point size renders a 12 px x-height at all — it jumps 11 px
    # (10 pt) straight to 13 px (11 pt) — so slot 0 had to be built a pixel
    # small, and at that size the apertures of 's' sealed shut (5 enclosed
    # pixels where an open letter must have none). The auto-hinter puts 11 pt
    # exactly on 12 px AND reopens the aperture: s = 0, and the 'e' eye goes
    # from 7 px to 26. The bench disqualified this face on the native-hinted
    # build; that verdict was an artifact of the hinter, not the design.
    force_autohint: true
    # Uniform slots: xh 12/14/16/18 exact on all four; advY 35/39/45/51,
    # slot 0 one px over (no span lands 34 there without moving the rest).
    sizes: [11, 12, 14, 16]
    metrics: {ascent: 1186, descent: -354, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf", variable: {wght: 400, wdth: 100}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf", variable: {wght: 700, wdth: 100}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo-Italic%5Bwdth%2Cwght%5D.ttf", variable: {wght: 400, wdth: 100}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo-Italic%5Bwdth%2Cwght%5D.ttf", variable: {wght: 700, wdth: 100}}

  - name: LibreFranklin
