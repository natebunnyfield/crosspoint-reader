    # Arrows 2026-08-17: an editor face meets them in a note as readily as a
    # reading face meets them in a book.
    intervals: latin-ext,(0x2190-0x21FF)
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/iaolo/iA-Fonts/master/iA%20Writer%20Quattro/Static/iAWriterQuattroS-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/iaolo/iA-Fonts/master/iA%20Writer%20Quattro/Static/iAWriterQuattroS-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/iaolo/iA-Fonts/master/iA%20Writer%20Quattro/Static/iAWriterQuattroS-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/iaolo/iA-Fonts/master/iA%20Writer%20Quattro/Static/iAWriterQuattroS-BoldItalic.ttf"}

