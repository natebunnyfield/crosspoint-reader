[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
; The suffix marks this fork in every env's version string (Settings corner, OTA
; screen, binary stamps). OTA's isNewer() parses only the numeric %d.%d.%d
; triple, so the suffix never affects update comparisons -- 1.5.0-B2 and
; 1.5.0-BNY compare identically, as 1.5.0.
;
; -BNY -> -B2 on 2026-08-18, -B2 -> -BD on 2026-08-19, both by owner
; instruction. Purely a label: see the isNewer() note above.
; 1.5.0 -> 1.5.2 on 2026-08-19: 1.5.1-B2 was already published, so the ini had
; fallen BEHIND the releases and a build from it would have reported a lower
; version than the device already had.
; 1.5.2 -> 1.5.3 on 2026-08-21 for the font-fix release. Upstream's bare tags
; 1.5.3-1.5.6 exist locally; our suffixed tag 1.5.3-BD does not collide.
version = 1.5.15-BD

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

; An unhandled enum case is a real defect in a dispatch switch -- the state
; renders nothing or the action does nothing -- and it had been scrolling past
; as a warning. Two were live when this was added: WifiSelectionActivity's
; PASSWORD_ENTRY (a bare header instead of the password screen's chrome) and
; FileManagerActivity's Edit, which was handled by an early return ABOVE the
; switch and so silently cost that function its exhaustiveness check.
;
; build_src_flags, not build_flags: this applies to src/ only. The vendored
; libraries (miniz, expat, uzlib) are not ours to make warning-clean, and
; failing the build on their switches would just get this flag deleted.
build_src_flags = -Werror=switch

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; No PPP modem and no Ethernet hardware on X4/X3. Correct settings, but
  ; MEASURED SAVING IS ZERO: .flash.text was 1,747,690 bytes both before and
  ; after adding them. --gc-sections had already dropped that code (the w5500,
  ; dm9051 and ksz8851 PHY drivers contribute 0 bytes even with CONFIG_ETH_*=y).
  ; Kept because they state hardware truth and stop the code coming back if
  ; something later takes a reference, NOT as a size lever. Do not cite these
  ; as having saved flash — the whole 1,090,352-byte reduction in that commit
  ; was .flash.rodata, i.e. font data and web assets.
  CONFIG_LWIP_PPP_SUPPORT=n
  CONFIG_ETH_ENABLED=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  ; B-029: a release built without the gitignored commercial editor faces
  ; succeeds silently and 430KB smaller. Fails gh_release/gh_release_rc, warns
  ; everywhere else so a clone with no licensed TTFs still builds.
  pre:scripts/check_editor_faces.py
  ; Caps build_cache_dir (LRU) and keeps the 50MB+ unstripped .elf out of it.
  ; Without it the cache never evicts: 11 GB in ten days, measured 2026-08-01.
  ; Needs both phases: pruning must precede compiling, but PROGNAME is only
  ; resolved by post: time, so the .elf cannot be named any earlier.
  pre:scripts/build_cache_policy.py
  post:scripts/build_cache_policy.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

; DO NOT re-add `lib_ignore = BLE`. It reads as "skip the Arduino BLE library",
; which sounds free because nothing here includes BLEDevice.h — but pioarduino
; does not treat it as a library name. component_manager.py:899-903 maps the
; token "BLE" onto the ESP-IDF COMPONENT "bt", and the lib_ignore handler then
; regex-deletes every bt CPPPATH entry out of the framework package's
; pioarduino-build.py (55 of them, including line 300 — the only -I that
; resolves <host/ble_gap.h>). src/notes/BleHidHost.cpp:112 then cannot compile,
; and it fails as a missing HEADER rather than a missing library, which is why
; this looked like a broken ESP-IDF core rather than a lib_ignore entry. `-lbt`
; survives the strip, so there is no link error to point at the cause either.
;
; It ran on every device env (all extend [base]) — the simulator envs have their
; own lib_ignore and were never affected. spike/ble-editor worked around it in
; spike-build.sh by injecting the ten nimble -I paths through
; PLATFORMIO_BUILD_FLAGS; that workaround is what this removal replaces. The
; script itself was deleted on 2026-08-08, precisely because this removal made
; it redundant — docs/ble-editor-spike.md records what it did.

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  ; CROSSPOINT_VERSION comes from scripts/git_branch.py, NOT from a literal here.
  ; Interpolating ${sysenv.CROSSPOINT_RC_HASH} made the resolved config depend on
  ; the variable, so toggling it wiped every env's build directory -- B-004.
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; git_branch.py only injects CROSSPOINT_VERSION for the default env; set it here.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sticky\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

# Linux/WSL sample for adding the simulator to your firmware's platformio.ini.
# Debian/Ubuntu/WSL dependencies: SDL3 dev headers (libsdl3-dev where packaged,
# otherwise build SDL3 from source) plus libssl-dev
# This sample is self-contained for builds. If you also want the PlatformIO
# IDE task entry "Run Simulator", make the consuming project own task
# registration:
#   custom_run_simulator_target_owner = project
#   post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
# under extra_scripts in the consuming firmware repo.

[env:simulator]
platform = native
lib_ldf_mode = deep+

; Same -Werror=switch as [base]. This env does NOT extend base -- it is a
; standalone native env -- so the flag has to be repeated here or the simulator
; build, which is where these warnings were actually seen, keeps scrolling past
; them. Verified by deleting a case and watching the build fail.
build_src_flags = -Werror=switch
; Optional native JPEG/PNG decoder mode:
; - add -DCROSSPOINT_SIM_USE_NATIVE_DECODERS under build_flags
; - uncomment lib_compat_mode = off
; - change lib_ignore to: hal, WebSockets
; - uncomment the PNGdec/JPEGDEC entries under lib_deps
; lib_compat_mode = off
; Uncomment when you also add the optional project-side hook below.
; custom_run_simulator_target_owner = project
; Uncomment if host ports 8080/8081 are occupied. WebSocket uses the next port.
; custom_simulator_http_port = 18080
build_src_filter =
  +<*>
  ; Firmware-update code remains non-destructive in the simulator.
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  ; Host SDL3 (brew install sdl3 / libsdl3-dev). Linux additionally needs
  ; -lssl -lcrypto -Wno-deprecated-declarations for the OpenSSL MD5 path.
  !pkg-config --cflags --libs sdl3
  -Wno-narrowing
  -DSIMULATOR
  ; CROSSPOINT_RENDER_SCALE is deliberately NOT set here. It defaults to 1, so a
  ; plain build mirrors the device, and is emitted by
  ; pre:scripts/sim_render_scale.py rather than living here, because PlatformIO
  ; *appends* PLATFORMIO_BUILD_FLAGS: a -D here made any override a second
  ; definition and every TU warned -Wmacro-redefined. To supersample glyphs at
  ; the host panel's real density (layout is unaffected -- advances, kerning and
  ; pagination keep reading the 1x tables):
  ;   CROSSPOINT_RENDER_SCALE=2 pio run -e simulator_x3 -t run_simulator
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; The sample also passes -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1, but this tree
  ; vendors miniz with lib/miniz/src/MinizConfig.h defining it (bare, not =1),
  ; so the flag here would only produce a "redefined" warning in every miniz TU.
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
  ; -DCROSSPOINT_SIM_USE_NATIVE_DECODERS
  ; -Dmemcpy_P=memcpy ; For native JPEGDEC
lib_ignore = hal, PNGdec, JPEGDEC
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
  ; Emits the single -DCROSSPOINT_RENDER_SCALE (default 1, override with the
  ; env var of the same name). See the note in build_flags above.
  pre:scripts/sim_render_scale.py
  ; [env:simulator] does not `extends = base`, so it needs its own entries.
  pre:scripts/build_cache_policy.py
  pre:scripts/check_editor_faces.py
  post:scripts/build_cache_policy.py
  ; Optional IDE task exposure:
  ; post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  ; Local dev against the simulator working copy (see the simulator repo README).
  ; Point at https://github.com/crosspoint-reader/crosspoint-simulator to build
  ; against upstream instead.
  ; For local simulator development, point this at your checkout instead:
  ;   simulator=symlink://../crosspoint-simulator   (both checkouts under ~/src)
  simulator=symlink://../crosspoint-simulator
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  ; Native decoder opt-in only:
  ; bitbank2/PNGdec @ 1.1.6
  ; https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:simulator_x3]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X3

[env:simulator_x4_pro]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X4_PRO

; Simulator with AddressSanitizer + UBSan. Same build as [env:simulator], but it
; halts on the failure classes that actually bit us on device and are invisible
; there: use-after-free (the reader's section holding a font ID through
; ensureLoaded()'s unloadAll()), stack-buffer-overflow in the render path, and
; out-of-bounds framebuffer writes. On device these corrupt memory and surface
; later as a reasonless panic; here they abort at the instruction that caused
; them.
;
;   pio run -e simulator_asan
;   ASAN_OPTIONS=detect_stack_use_after_return=1 .pio/build/simulator_asan/program
[env:simulator_asan]
extends = env:simulator
build_type = debug
build_flags =
  ${env:simulator.build_flags}
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
  -g
build_src_filter = ${env:simulator.build_src_filter}
lib_ignore = ${env:simulator.lib_ignore}
