# Blind serif bench: 8 owner-picked keepers from the bold-italic bake-off.
# NOT a shipping list -- same status as sans-candidates.yaml / grotesque-candidates.yaml.
# Was 14; Accanthis, Merriweather/MerriweatherLight and Spectral/SpectralLight
# were cut to C tier and LibrisADF promoted to S tier on 2026-08-12 (owner
# ruling; see docs/sd-card-fonts.md). Cut families keep their recipe in the
# main lib/EpdFont/scripts/sd-fonts.yaml catalog instead of here -- Merriweather
# was already there, Accanthis and Spectral were added alongside the cut.
#   python3 lib/EpdFont/scripts/build-sd-fonts.py \
#     --config tools/blind-bench/blind-candidates.yaml --output-dir out/

families:
  - name: Almendra
    description: "Blind bench candidate"
    intervals: latin-ext
    sizes: [10, 12, 14, 17]
    metrics: {ascent: 950, descent: -570, linegap: 0}
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/almendra/Almendra-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/almendra/Almendra-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/almendra/Almendra-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/almendra/Almendra-BoldItalic.ttf"}

