installed_families: []
tier_drops:
  3:
  - 11835
families:
- name: HerosRef
  description: GUST's Helvetica revival, via URW Nimbus Sans (Latin)
  intervals: reading
  force_autohint: true
  sizes:
  - 9
  - 11
  - 12
  - 14
  metrics:
    ascent: 1040
    descent: -523
    linegap: 0
  styles:
    regular:
      scale: 1.014
      url: https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-regular.otf
    bold:
      scale: 1.014
      url: https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-bold.otf
    italic:
      scale: 1.014
      url: https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-italic.otf
    bolditalic:
      scale: 1.014
      url: https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-bolditalic.otf
- name: HerosTextCut
  description: GUST's Helvetica revival, via URW Nimbus Sans (Latin)
  intervals: reading
  # Both of these mirror the shipped sd-fonts.yaml recipe, and they have to:
  # an arm of an A/B built from a different recipe measures the recipe. Round
  # 11 is the precedent -- a dropped `scale: 1.014` had stock rendered 1.4%
  # larger for eight rounds. Without synth_ligatures the proof builds `ligs=0`
  # against HerosRef's `ligs=5` and every fi/fl in the specimen's body text is
  # an unmatched pair.
  synth_ligatures: [ff, fi, fl, ffi, ffl]
  fallback_head:
    regular:    {scale: 1.014, url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-regular.otf"}
    bold:       {scale: 1.014, url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-bold.otf"}
    italic:     {scale: 1.014, url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-italic.otf"}
    bolditalic: {scale: 1.014, url: "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreheros-bolditalic.otf"}
  force_autohint: true
  sizes:
  - 9
  - 11
  - 12
  - 14
  metrics:
    ascent: 1040
    descent: -523
    linegap: 0
  styles:
    regular:
      scale: 1.014
      path: local_fonts/HerosTextCut-regular.ttf
    bold:
      scale: 1.014
      path: local_fonts/HerosTextCut-bold.ttf
    italic:
      scale: 1.014
      path: local_fonts/HerosTextCut-italic.ttf
    bolditalic:
      scale: 1.014
      path: local_fonts/HerosTextCut-bolditalic.ttf
